<!DOCTYPE html>
<html lang="id" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Akademik & Omniscient Grader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track, #0f172a); }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; }
    </style>
</head>
<body class="h-full bg-slate-950 dark:bg-slate-950 text-slate-100 dark:text-slate-100 flex flex-col selection:bg-indigo-500 selection:text-white transition-colors duration-200" id="body-root">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[100] space-y-2 pointer-events-none"></div>

    <!-- APLIKASI UTAMA -->
    <div id="app" class="min-h-full flex flex-col">
        <div class="flex items-center justify-center flex-grow p-6">
            <div class="text-center">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500 mb-4"></i>
                <p class="text-slate-400 font-medium">Inisialisasi Matriks Sistem Cloud...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Core Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc, updateDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { collectionGroup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // PRODUKSI AKTIF (TERHUBUNG KE FIREBASE CLOUD)
        // ==========================================
        const is_preview = false; 

        window.mockData = {
            users: [
                { id: 'mock-guru-id', name: 'Saprudin, S.Ag', email: 'saprudin@ud.in', role: 'guru' }
            ],
            journals: [],
            grades: [],
            exams: [],
            evaluations: []
        };

        const firebaseConfig = {
  apiKey: "AIzaSyBdiFDd3HFwy82G4_vQE3gOp_zi6jjBCig",
  authDomain: "jurnal-database.firebaseapp.com",
  projectId: "jurnal-database",
  storageBucket: "jurnal-database.firebasestorage.app",
  messagingSenderId: "1028098900309",
  appId: "1:1028098900309:web:ed107c9a7f583afe7cafdc",
  measurementId: "G-JXVKCVFSFX"
        };

        let app, auth, db;
        if (!is_preview) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        let currentUser = null;
        let userRole = 'guru'; 
        let currentTab = localStorage.getItem('omni_tab') || 'jurnal'; 
        let subTabNilai = localStorage.getItem('omni_subtab') || 'riwayat'; 
        
        let cachedJournals = [];
        let cachedGrades = [];
        let graderExams = [];
        let currentExamId = null;
        let editorQuestions = [];

        let adminSelectedTeacherId = null; 
        let adminCachedUsers = [];
        let adminCachedJournals = [];
        let adminCachedGrades = [];

        const root = document.getElementById('app');

        window.toggleTheme = function() {
            const htmlEl = document.documentElement;
            const currentTheme = localStorage.getItem('theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            if (newTheme === 'light') {
                htmlEl.classList.remove('dark');
                document.body.className = "h-full bg-slate-100 text-slate-800 flex flex-col selection:bg-indigo-500 selection:text-white transition-colors duration-200";
            } else {
                htmlEl.classList.add('dark');
                document.body.className = "h-full bg-slate-950 text-slate-100 flex flex-col selection:bg-indigo-500 selection:text-white transition-colors duration-200";
            }
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        };

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            const htmlEl = document.documentElement;
            if (savedTheme === 'light') {
                htmlEl.classList.remove('dark');
                document.body.className = "h-full bg-slate-100 text-slate-800 flex flex-col selection:bg-indigo-500 selection:text-white transition-colors duration-200";
            } else {
                htmlEl.classList.add('dark');
                document.body.className = "h-full bg-slate-950 text-slate-100 flex flex-col selection:bg-indigo-500 selection:text-white transition-colors duration-200";
            }
            updateThemeIcon(savedTheme);
        }

        function updateThemeIcon(theme) {
            const iconEl = document.getElementById('theme-icon');
            if(iconEl) {
                iconEl.className = theme === 'light' ? 'fa-solid fa-moon text-slate-700' : 'fa-solid fa-sun text-amber-400';
            }
        }

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl text-xs font-semibold shadow-xl border flex items-center space-x-2 transition transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-950/90 border-emerald-500/30 text-emerald-300' : 'bg-rose-950/90 border-rose-500/30 text-rose-300'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'} text-sm"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        function initApp() {
            initTheme();
            if (is_preview) {
                currentUser = { uid: 'mock-admin-id', email: 'admin@alirsyad.or.id', name: 'Admin', role: 'admin' };
                userRole = 'admin';
                renderMainDashboard();
            } else {
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUser = user;
                        try {
                            const userDoc = await getDocs(query(collection(db, 'users'), where('__name__', '==', user.uid)));
                            if (!userDoc.empty) {
                                userRole = userDoc.docs[0].data().role || 'guru';
                                currentUser.name = userDoc.docs[0].data().name || user.email.split('@')[0];
                            } else {
                                const detectedRole = user.email.toLowerCase().includes('admin') ? 'admin' : 'guru';
                                await setDoc(doc(db, 'users', user.uid), { role: detectedRole, name: user.email.split('@')[0], email: user.email });
                                userRole = detectedRole;
                                currentUser.name = user.email.split('@')[0];
                            }
                        } catch (e) {
                            userRole = user.email.toLowerCase().includes('admin') ? 'admin' : 'guru';
                        }
                        renderMainDashboard();
                    } else {
                        currentUser = null;
                        window.renderLogin();
                    }
                });
            }
        }

        window.renderLogin = function(isRegister = false) {
            root.innerHTML = `
                <div class="flex-grow flex items-center justify-center p-4 bg-slate-950 dark:bg-slate-950 transition-colors">
                    <div class="max-w-md w-full bg-slate-900 dark:bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
                        <div class="flex justify-end mb-2">
                            <button onclick="window.toggleTheme()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center transition border border-slate-700">
                                <i id="theme-icon" class="fa-solid ${localStorage.getItem('theme') === 'light' ? 'fa-moon text-slate-300' : 'fa-sun text-amber-400'} text-sm"></i>
                            </button>
                        </div>
                        <div class="text-center mb-6">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/10 text-indigo-500 mb-4 border border-indigo-500/20 overflow-hidden p-2">
                                <img src="https://iili.io/CQPsxMQ.md.png" alt="Logo" class="w-full h-full object-contain">
                            </div>
                            <h1 class="text-2xl font-bold text-white tracking-tight">${isRegister ? 'Pendaftaran Akun Guru' : 'Portal Akademik'}</h1>
                            <p class="text-sm text-slate-400 mt-1">${isRegister ? 'Daftar baru untuk mulai mengisi jurnal & nilai' : 'Otorisasi Sistem Terpusat & Jurnal Thullab'}</p>
                        </div>

                        <form id="auth-form" class="space-y-4">
                            ${isRegister ? `
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Nama Lengkap & Gelar</label>
                                <input type="text" id="reg-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="Ustadz Ahmad, S.Pd">
                            </div>` : ''}
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Alamat Email</label>
                                <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="nama@sekolah.com">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Kata Sandi</label>
                                <input type="password" id="auth-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-indigo-600/20">
                                ${isRegister ? 'Daftar Akun Guru' : 'Masuk ke Sistem'}
                            </button>
                        </form>
                        <div class="mt-6 text-center border-t border-slate-800 pt-4">
                            <button onclick="window.renderLogin(${!isRegister})" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium transition">
                                ${isRegister ? 'Sudah punya akun? Masuk di sini' : 'Belum punya akun? Daftar sebagai Guru baru'}
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('auth-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('auth-email').value;
                const password = document.getElementById('auth-password').value;
                const nameInput = document.getElementById('reg-name');
                const fullName = nameInput ? nameInput.value : email.split('@')[0];

                if (!is_preview) {
                    try {
                        if (isRegister) {
                            const cred = await createUserWithEmailAndPassword(auth, email, password);
                            const assignedRole = email.toLowerCase().includes('admin') ? 'admin' : 'guru';
                            await setDoc(doc(db, 'users', cred.user.uid), {
                                role: assignedRole,
                                name: fullName,
                                email: email
                            });
                            window.showToast('Pendaftaran akun berhasil!', 'success');
                        } else {
                            await signInWithEmailAndPassword(auth, email, password);
                            window.showToast('Berhasil masuk ke sistem!', 'success');
                        }
                    } catch (err) {
                        window.showToast(err.message, 'error');
                    }
                } else {
                    const assignedRole = email.toLowerCase().includes('admin') ? 'admin' : 'guru';
                    currentUser = { uid: assignedRole === 'admin' ? 'mock-admin-id' : 'mock-guru-id', email, name: fullName, role: assignedRole };
                    userRole = currentUser.role;
                    window.renderMainDashboard();
                    window.showToast('Berhasil masuk mode simulasi!', 'success');
                }
            });
        };

        window.renderMainDashboard = function() {
            root.innerHTML = `
                <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between h-16 items-center">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-600/30 overflow-hidden p-1.5">
                                    <img src="https://iili.io/CQPsxMQ.md.png" alt="Logo" class="w-full h-full object-contain">
                                </div>
                                <div>
                                    <span class="font-bold text-white text-base">E-Jurnal & Nilai Thullab</span>
                                    <span class="block text-[10px] text-indigo-400 font-semibold uppercase tracking-wider">${userRole.toUpperCase()} PANEL</span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button onclick="window.toggleTheme()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center transition border border-slate-700" title="Ganti Tema">
                                    <i id="theme-icon" class="fa-solid ${localStorage.getItem('theme') === 'light' ? 'fa-moon text-slate-300' : 'fa-sun text-amber-400'} text-sm"></i>
                                </button>
                                <span class="text-xs text-slate-300 hidden sm:inline"><i class="fa-solid fa-user-circle mr-1 text-slate-400"></i> ${currentUser ? (currentUser.name || currentUser.email) : ''}</span>
                                <button id="btn-logout" class="bg-slate-800 hover:bg-rose-500/20 hover:text-rose-400 border border-slate-700 px-3.5 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-1.5 text-slate-200">
                                    <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Keluar</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </nav>
                <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
                    ${userRole === 'admin' ? renderAdminDashboardHTML() : renderGuruDashboardHTML()}
                </main>
            `;

            document.getElementById('btn-logout').addEventListener('click', async () => {
                if (is_preview) {
                    currentUser = null;
                    window.renderLogin();
                } else {
                    await signOut(auth);
                }
            });

            if (userRole === 'admin') {
                initAdminLogic();
            } else {
                initGuruLogic();
                window.switchTab(currentTab);
                window.switchSubNilai(subTabNilai);
            }
        }

        function initAdminLogic() {
            const container = document.getElementById('admin-teacher-list');
            if(!container) return;

            if (is_preview) {
                adminCachedUsers = window.mockData.users;
                adminCachedJournals = window.mockData.journals;
                adminCachedGrades = window.mockData.grades;
                renderAdminData();
            } else {
                const updateAdminUI = () => renderAdminData();

                onSnapshot(collection(db, 'users'), (snap) => {
                    adminCachedUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    updateAdminUI();
                });

                onSnapshot(collectionGroup(db, 'journals'), (snap) => {
                    adminCachedJournals = snap.docs.map(doc => ({ id: doc.id, userId: doc.ref.parent.parent.id, ...doc.data() }));
                    updateAdminUI();
                });

                onSnapshot(collectionGroup(db, 'grades'), (snap) => {
                    adminCachedGrades = snap.docs.map(doc => ({ id: doc.id, userId: doc.ref.parent.parent.id, ...doc.data() }));
                    updateAdminUI();
                });
            }
        }

        window.selectAdminTeacher = function(id) {
            adminSelectedTeacherId = id;
            renderAdminData();
        };

        function renderAdminData() {
            const container = document.getElementById('admin-teacher-list');
            if(!container) return;

            const teacherList = adminCachedUsers.filter(t => t.role !== 'admin');
            if (teacherList.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 dark:text-slate-400 italic">Belum ada akun guru yang terdaftar.</p>`;
                return;
            }

            if (!adminSelectedTeacherId && teacherList.length > 0) {
                adminSelectedTeacherId = teacherList[0].id;
            }

            const selectedTeacher = teacherList.find(t => t.id === adminSelectedTeacherId);
            const tJournals = adminCachedJournals.filter(j => j.userId === adminSelectedTeacherId);

            const sidebarHTML = `
                <div class="bg-white dark:bg-[#0f1423] border border-slate-200 dark:border-[#1e293b] rounded-2xl p-5 flex-shrink-0 w-full md:w-80 h-fit shadow-lg dark:shadow-none transition-colors duration-200">
                    <h3 class="text-xs font-bold text-slate-600 dark:text-slate-300 uppercase tracking-widest mb-4 flex items-center">
                        <i class="fa-solid fa-users-gear mr-2 text-slate-400"></i> DAFTAR PENGAJAR
                    </h3>
                    <div class="space-y-3">
                        ${teacherList.map(t => `
                            <button onclick="window.selectAdminTeacher('${t.id}')" class="w-full text-left bg-transparent border ${adminSelectedTeacherId === t.id ? 'border-blue-500 bg-[#161f36]' : 'border-[#1e293b] hover:border-[#334155]'} rounded-xl p-4 transition-all flex items-center justify-between group">
                                <div class="flex items-center space-x-3">
                                    <div class="w-9 h-9 rounded-lg bg-blue-900/30 text-blue-400 flex items-center justify-center border border-blue-800/50">
                                        <i class="fa-solid fa-chalkboard-user text-sm"></i>
                                    </div>
                                    <div>
                                        <h4 class="text-sm font-bold text-white group-hover:text-blue-400 transition-colors">${t.name || t.email}</h4>
                                        <span class="text-[10px] text-slate-500">${t.email}</span>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-3">
                                    <span onclick="window.deleteAdminTeacher(event, '${t.id}')" class="text-slate-600 hover:text-rose-500 p-1 cursor-pointer transition-colors" title="Hapus Guru">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </span>
                                    <i class="fa-solid fa-chevron-right text-slate-600 text-xs ${adminSelectedTeacherId === t.id ? 'text-blue-500' : ''}"></i>
                                </div>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            let detailHTML = `<div class="flex-1 bg-[#0f1423] border border-[#1e293b] rounded-2xl p-6 h-fit min-h-[500px] flex items-center justify-center"><p class="text-slate-500 text-sm">Pilih guru untuk melihat detail.</p></div>`;
            
            if (selectedTeacher) {
                detailHTML = `
                    <div class="flex-1 bg-white dark:bg-[#0f1423] border border-slate-200 dark:border-[#1e293b] rounded-2xl p-6 md:p-8 h-fit space-y-8 shadow-lg dark:shadow-none transition-colors duration-200">
                        <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-200 dark:border-[#1e293b] pb-6 gap-4">
                            <div>
                                <span class="text-[10px] font-bold text-blue-600 dark:text-blue-500 uppercase tracking-widest block mb-1">PEMERIKSAAN GURU</span>
                                <h2 class="text-2xl font-bold text-slate-900 dark:text-white">${selectedTeacher.name || selectedTeacher.email}</h2>
                            </div>
                            <span class="text-xs bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800/50 px-4 py-2 rounded-full font-medium whitespace-nowrap">
                                Akses Mata Dewa Aktif
                            </span>
                        </div>

                        <div class="bg-slate-50 dark:bg-[#121829] border border-slate-200 dark:border-[#1e293b] rounded-xl p-5 relative overflow-hidden transition-colors duration-200">
                            <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest mb-3 flex items-center">
                                <i class="fa-solid fa-paper-plane mr-2 text-blue-500"></i> KIRIM CATATAN EVALUASI
                            </h3>
                            <form onsubmit="window.sendAdminEvaluation(event, '${selectedTeacher.id}')" class="space-y-3">
                                <textarea id="eval-msg-${selectedTeacher.id}" required rows="3" placeholder="Tulis catatan atau arahan untuk guru ini..." class="w-full bg-white dark:bg-[#0a0d17] border border-slate-200 dark:border-[#1e293b] rounded-xl p-4 text-sm text-slate-900 dark:text-white outline-none focus:border-blue-500 resize-y"></textarea>
                                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-blue-600/20 w-fit">
                                    Kirim Evaluasi
                                </button>
                            </form>
                        </div>

                        <div class="space-y-4">
                            <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest flex items-center mb-4">
                                <i class="fa-solid fa-book text-blue-500 mr-2"></i> RIWAYAT JURNAL MENGAJAR
                            </h3>
                            ${tJournals.length === 0 ? `<p class="text-sm text-slate-500 italic">Belum ada jurnal yang diisi oleh guru ini.</p>` : `
                                <div class="space-y-4">
                                    ${tJournals.sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal)).map(j => `
                                        <div class="bg-slate-50 dark:bg-[#0a0d17] border border-slate-200 dark:border-[#1e293b] rounded-xl p-5 md:p-6 text-sm text-slate-700 dark:text-slate-300 space-y-3 hover:border-slate-300 dark:hover:border-[#334155] transition-colors relative">
                                            <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-2 mb-2">
                                                <div class="space-y-1">
                                                    <span class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/20 px-2 py-0.5 rounded border border-emerald-200 dark:border-emerald-800/50 uppercase inline-block">${j.mapel}</span>
                                                    <h4 class="text-base font-bold text-slate-900 dark:text-white mt-1">${j.materi}</h4>
                                                </div>
                                                <span class="text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap">${j.tanggal} (${j.waktu})</span>
                                            </div>
                                            
                                            <p><b class="text-slate-900 dark:text-white font-semibold">Tujuan:</b> ${j.tujuan}</p>
                                            <p><b class="text-slate-900 dark:text-white font-semibold">Metode:</b> ${j.metode} <span class="text-slate-400 mx-1">|</span> <b class="text-slate-900 dark:text-white font-semibold">Media:</b> ${j.media}</p>
                                            <p><b class="text-slate-900 dark:text-white font-semibold">Kehadiran:</b> ${j.kehadiran}</p>
                                            <p><b class="text-slate-900 dark:text-white font-semibold">Capaian:</b> ${j.capaian}</p>

        window.deleteAdminTeacher = async function(e, teacherId) {
            e.stopPropagation(); // Mencegah terpicunya klik pemilihan guru
            if (is_preview) {
                window.mockData.users = window.mockData.users.filter(u => u.id !== teacherId);
                if(adminSelectedTeacherId === teacherId) adminSelectedTeacherId = null;
                window.showToast('Akun guru dihapus dari daftar.', 'success');
                renderAdminData();
            } else {
                try {
                    await deleteDoc(doc(db, 'users', teacherId));
                    if(adminSelectedTeacherId === teacherId) adminSelectedTeacherId = null;
                    window.showToast('Akun guru berhasil dihapus dari Cloud.', 'success');
                } catch(err) {
                    window.showToast('Gagal menghapus: ' + err.message, 'error');
                }
            }
        };

        window.sendMicroEval = async function(e, teacherId, journalId) {
            e.preventDefault();
            const input = document.getElementById(`micro-eval-${journalId}`);
            const msg = input.value.trim();
            if(!msg) return;

            if (is_preview) {
                const jIdx = window.mockData.journals.findIndex(j => j.id === journalId);
                if(jIdx > -1) {
                    window.mockData.journals[jIdx].adminNotes = msg;
                    input.value = '';
                    window.showToast('Catatan terkirim!', 'success');
                    renderAdminData();
                }
            } else {
                try {
                    await updateDoc(doc(db, 'users', teacherId, 'journals', journalId), {
                        adminNotes: msg
                    });
                    input.value = '';
                    window.showToast('Catatan terkirim ke cloud!', 'success');
                } catch(err) {
                    window.showToast(err.message, 'error');
                }
            }
        };

        window.sendAdminEvaluation = async function(e, teacherId) {
            e.preventDefault();
            const input = document.getElementById(`eval-msg-${teacherId}`);
            const msg = input.value.trim();
            if(!msg) return;

            const evalObj = {
                message: msg,
                date: new Date().toISOString().split('T')[0],
                adminName: currentUser.name || 'Kepala Madrasah'
            };

            if (is_preview) {
                window.mockData.evaluations.push({ id: 'eval_' + Date.now(), teacherId, ...evalObj });
                input.value = '';
                window.showToast('Catatan evaluasi berhasil dikirim ke guru!', 'success');
            } else {
                try {
                    await addDoc(collection(db, 'users', teacherId, 'evaluations'), evalObj);
                    input.value = '';
                    window.showToast('Catatan evaluasi berhasil dikirim ke guru!', 'success');
                } catch(err) {
                    window.showToast(err.message, 'error');
                }
            }
        };

                window.scrollTo({ top: container.offsetTop - 50, behavior: 'smooth' });

                container.classList.add('hidden');
                document.getElementById('jurnal-form').reset();
                document.getElementById('edit-jurnal-id').value = '';

        document.getElementById('app').addEventListener('submit', async (e) => {
            if(e.target.id === 'jurnal-form') {
                e.preventDefault();
                const id = document.getElementById('edit-jurnal-id').value;
                const data = {
                    tanggal: document.getElementById('j-tanggal').value,
                    waktu: document.getElementById('j-waktu').value,
                    kelas: document.getElementById('j-kelas').value,
                    mapel: document.getElementById('j-mapel').value,
                    materi: document.getElementById('j-materi').value,
                    tujuan: document.getElementById('j-tujuan').value,
                    metode: document.getElementById('j-metode').value,
                    media: document.getElementById('j-media').value,
                    kehadiran: document.getElementById('j-kehadiran').value,
                    capaian: document.getElementById('j-capaian').value,
                    kendala: document.getElementById('j-kendala').value,
                    tindakLanjut: document.getElementById('j-tindak').value,
                    userId: currentUser.uid
                };

                if (is_preview) {
                    if (id) {
                        const idx = window.mockData.journals.findIndex(j => j.id === id);
                        if (idx !== -1) window.mockData.journals[idx] = { id, ...data };
                    } else {
                        window.mockData.journals.push({ id: 'j_' + Date.now(), ...data });
                    }
                    window.toggleJurnalForm();
                    loadGuruJournals();
                    window.showToast('Jurnal tersimpan');
                } else {
                    try {
                        if (id) {
                            await setDoc(doc(db, 'users', currentUser.uid, 'journals', id), data);
                        } else {
                            await addDoc(collection(db, 'users', currentUser.uid, 'journals'), data);
                        }
                        window.toggleJurnalForm();
                        window.showToast('Jurnal berhasil disimpan ke Cloud!');
                    } catch (err) {
                        window.showToast(err.message, 'error');
                    }
                }
            }
        });

        window.editJurnal = function(id) {
            const j = cachedJournals.find(item => item.id === id);
            if (!j) return;
            const container = document.getElementById('jurnal-form-container');
            container.classList.remove('hidden');
            document.getElementById('edit-jurnal-id').value = j.id;
            ['tanggal','waktu','kelas','mapel','materi','tujuan','metode','media','kehadiran','capaian','kendala'].forEach(f => {
                const el = document.getElementById(`j-${f}`);
                if(el) el.value = j[f] || '';
            });
            document.getElementById('j-tindak').value = j.tindakLanjut || '';
            window.scrollTo({ top: container.offsetTop - 50, behavior: 'smooth' });
        };

        window.deleteJurnal = async function(id) {
            if (is_preview) {
                window.mockData.journals = window.mockData.journals.filter(j => j.id !== id);
                loadGuruJournals();
                window.showToast('Jurnal dihapus', 'success');
            } else {
                try {
                    await deleteDoc(doc(db, 'users', currentUser.uid, 'journals', id));
                    window.showToast('Jurnal berhasil dihapus', 'success');
                } catch (err) {
                    window.showToast(err.message, 'error');
                }
            }
        };

        function loadGuruJournals() {
            if (is_preview) {
                cachedJournals = window.mockData.journals.filter(j => j.userId === currentUser.uid);
                renderJournalsUI(cachedJournals);
            } else {
                onSnapshot(collection(db, 'users', currentUser.uid, 'journals'), (snapshot) => {
                    cachedJournals = [];
                    snapshot.forEach(doc => cachedJournals.push({ id: doc.id, ...doc.data() }));
                    renderJournalsUI(cachedJournals);
                }, (err) => { console.error(err); });
            }
        }

            const c = document.getElementById('guru-eval-list');

            if(is_preview) {

                renderEvaluationsUI(evals);
            } else {
                onSnapshot(collection(db, 'users', currentUser.uid, 'evaluations'), (snapshot) => {
                    const evals = [];

        document.getElementById('app').addEventListener('submit', async (e) => {
            if(e.target.id === 'grades-form') {
                e.preventDefault();
                const kelas = document.getElementById('g-kelas').value;
                const topik = document.getElementById('g-topik').value;
                const rawData = document.getElementById('g-raw-data').value;
                
                const dataSiswa = [];
                rawData.split('\n').forEach(line => {
                    const parts = line.trim().split(/\s+/);
                    if (parts.length >= 2) {
                        const nilai = parseFloat(parts.pop());
                        const nama = parts.join(' ');
                        if (nama && !isNaN(nilai)) dataSiswa.push({ nama, nilai });
                    }
                });

                if (dataSiswa.length === 0) return window.showToast('Format data tidak valid!', 'error');

                const gradeObj = { kelas, topik, tanggal: new Date().toISOString().split('T')[0], dataSiswa, userId: currentUser.uid };

                if (is_preview) {
                    window.mockData.grades.push({ id: 'g_' + Date.now(), ...gradeObj });
                    window.toggleGradesForm();
                    loadGuruGrades();
                    window.showToast('Rekap tersimpan!');
                } else {
                    try {
                        await addDoc(collection(db, 'users', currentUser.uid, 'grades'), gradeObj);
                        window.toggleGradesForm();
                        window.showToast('Rekap nilai berhasil disimpan ke Cloud!');
                    } catch (err) {
                        window.showToast(err.message, 'error');
                    }
                }
            }
        });

        function populateMatrixDropdown(grades) {
            const select = document.getElementById('select-kelas-matrix');
            if (!select) return;
            const unique = [...new Set(grades.map(g => g.kelas))];
            select.innerHTML = `<option value="">Pilih Kelas...</option>` + unique.map(c => `<option value="${c}">${c}</option>`).join('');

        window.renderMatrixTable = function() {
            const kelas = document.getElementById('select-kelas-matrix').value;
            const c = document.getElementById('matrix-table-container');
            const btnExport = document.getElementById('btn-export-matrix');
            const btnExportPDF = document.getElementById('btn-export-pdf');

            if (!kelas) {
                if(btnExport) btnExport.classList.add('hidden');
                if(btnExportPDF) btnExportPDF.classList.add('hidden');
                return c.innerHTML = `Pilih kelas dahulu.`;
            }

            const cGrades = cachedGrades.filter(g => g.kelas === kelas);
            if (cGrades.length === 0) {
                if(btnExport) btnExport.classList.add('hidden');
                if(btnExportPDF) btnExportPDF.classList.add('hidden');
                return c.innerHTML = `Tidak ada data.`;
            }

            if(btnExport) btnExport.classList.remove('hidden');
            if(btnExportPDF) btnExportPDF.classList.remove('hidden');

            const map = {};
            cGrades.forEach(g => {
                g.dataSiswa.forEach(s => {
                    if (!map[s.nama]) map[s.nama] = {};
                    map[s.nama][g.topik] = s.nilai;
                });
            });

            const students = Object.keys(map).sort();
            const topics = cGrades.map(g => g.topik);

            c.innerHTML = `
                <table class="w-full text-left text-xs border-collapse border border-slate-800">
                    <thead>
                        <tr class="bg-slate-950 text-slate-400 border-b border-slate-800">
                            <th class="p-2 border border-slate-800">Nama Siswa</th>
                            ${topics.map(t => `<th class="p-2 border border-slate-800 text-center truncate max-w-[100px]" title="${t}">${t}</th>`).join('')}
                            <th class="p-2 border border-slate-800 text-center text-indigo-400">Rata-Rata</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800">
                        ${students.map(name => {
                            let total = 0, count = 0;
                            const cells = topics.map(t => {
                                const val = map[name][t];
                                if (val !== undefined) { total += val; count++; }
                                return `<td class="p-2 border border-slate-800 text-center font-medium ${val !== undefined && val < 75 ? 'text-rose-400' : 'text-slate-200'}">${val !== undefined ? val : '-'}</td>`;
                            }).join('');
                            const avg = count > 0 ? (total / count).toFixed(1) : '-';
                            return `<tr><td class="p-2 border border-slate-800 font-semibold text-white">${name}</td>${cells}<td class="p-2 border border-slate-800 text-center font-bold text-indigo-400">${avg}</td></tr>`;
                        }).join('')}
                    </tbody>
                </table>
            `;
        };

        window.exportMatrixCSV = function() {
            const kelas = document.getElementById('select-kelas-matrix').value;
            if (!kelas) return window.showToast('Pilih kelas terlebih dahulu', 'error');

            const cGrades = cachedGrades.filter(g => g.kelas === kelas);
            if (cGrades.length === 0) return window.showToast('Tidak ada data untuk diekspor', 'error');

            const map = {};
            cGrades.forEach(g => {
                g.dataSiswa.forEach(s => {
                    if (!map[s.nama]) map[s.nama] = {};
                    map[s.nama][g.topik] = s.nilai;
                });
            });

            const students = Object.keys(map).sort();
            const topics = cGrades.map(g => g.topik);

            let csvContent = "Nama Siswa," + topics.map(t => `"${t.replace(/"/g, '""')}"`).join(",") + ",Rata-Rata\n";

            students.forEach(name => {
                let total = 0, count = 0;
                let row = `"${name}"`;
                topics.forEach(t => {
                    const val = map[name][t];
                    if (val !== undefined) { total += val; count++; }
                    row += `,${val !== undefined ? val : ''}`;
                });
                const avg = count > 0 ? (total / count).toFixed(1) : '';
                row += `,${avg}\n`;
                csvContent += row;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Rekap_Nilai_${kelas.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.showToast('Matriks berhasil diunduh (CSV)!', 'success');
        };

        window.exportMatrixPDF = function() {

                    <h4 style="text-align: center; margin-top: 0; color: #475569; margin-bottom: 30px;">Kelas: ${kelas}</h4>
                    <style>
                        table { width: 100%; border-collapse: collapse; font-size: 12px; }

                        td:first-child { text-align: left; font-weight: bold; }

        window.navGrader = function(view) {
            ['dashboard', 'editor', 'koreksi'].forEach(v => document.getElementById(`g-view-${v}`).classList.add('hidden'));
            document.getElementById(`g-view-${view}`).classList.remove('hidden');
            if (view === 'dashboard') renderGraderDash();

        function loadGraderExamsData() {
            if (is_preview) {
                graderExams = window.mockData.exams;
                renderGraderDash();
            } else {
                onSnapshot(collection(db, 'exams'), (snapshot) => {
                    graderExams = [];
                    snapshot.forEach(doc => graderExams.push({ id: doc.id, ...doc.data() }));
                    if(document.getElementById('g-view-dashboard') && !document.getElementById('g-view-dashboard').classList.contains('hidden')) {
                        renderGraderDash();
                    }
                }, (err) => { console.error(err); });
            }

            const c = document.getElementById('g-exams-container');

            c.innerHTML = graderExams.map(e => `

        window.deleteGraderExam = async function(id, title) {
            if(!confirm(`PERINGATAN: Apakah Anda yakin ingin menghapus instrumen ujian "${title}"?`)) return;
            
            if (is_preview) {
                window.mockData.exams = window.mockData.exams.filter(x => x.id !== id);
                loadGraderExamsData();
                window.showToast('Kunci jawaban berhasil dihapus.', 'success');
            } else {
                try {
                    await deleteDoc(doc(db, 'exams', id));
                    window.showToast('Kunci jawaban berhasil dihapus dari Cloud.', 'success');
                } catch(err) {
                    window.showToast(err.message, 'error');
                }
            }
        };

        let activeChartInstance = null;
        window.openExamAnalytics = function(examId) {
            const exam = graderExams.find(x => x.id === examId);
            if(!exam) return;
            
            document.getElementById('analytics-exam-title').textContent = exam.title;
            document.getElementById('exam-analytics-modal').classList.remove('hidden');

            const matchingGrade = cachedGrades.find(g => g.topik.includes(exam.title) && g.kelas === (exam.className || 'Tanpa Kelas'));
            const dataSiswa = matchingGrade ? matchingGrade.dataSiswa : [];

            let tuntasCount = 0;
            let remedialCount = 0;
            dataSiswa.forEach(s => {
                if(s.nilai >= (exam.kkm || 75)) tuntasCount++;
                else remedialCount++;
            });

            const summaryEl = document.getElementById('analytics-summary-text');
            if(dataSiswa.length === 0) {
                summaryEl.textContent = "Belum ada siswa yang dikoreksi untuk ujian ini.";
            } else {
                summaryEl.textContent = `Total Siswa Direkap: ${dataSiswa.length} | Tuntas: ${tuntasCount} | Remedial: ${remedialCount}`;
            }

            const ctx = document.getElementById('exam-chart-canvas').getContext('2d');
            if(activeChartInstance) activeChartInstance.destroy();

            activeChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Tuntas', 'Remedial'],
                    datasets: [{
                        data: dataSiswa.length > 0 ? [tuntasCount, remedialCount] : [1, 1],
                        backgroundColor: dataSiswa.length > 0 ? ['#34d399', '#f43f5e'] : ['#334155', '#1e293b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#cbd5e1', font: { size: 11 } } }
                    }
                }
            });
        };

        window.editGraderExam = function(id) {
            currentExamId = id;
            const e = graderExams.find(x => x.id === id);
            if (e) {
                document.getElementById('ge-title').value = e.title || '';
                document.getElementById('ge-class').value = e.className || '';
                document.getElementById('ge-topic').value = e.topic || '';
                document.getElementById('ge-kkm').value = e.kkm || 75;
                editorQuestions = JSON.parse(JSON.stringify(e.questions || []));
            }
            window.navGrader('editor');
            renderEditorQuestions();
        };

        window.addGraderQ = function(type) {
            const q = { id: 'q_' + Date.now(), type, weight: 1 };
            if (type === 'PG') q.key = 'A';
            if (type === 'PGK') q.key = [];
            if (type === 'JODOH') q.pairs = [{ p: '', r: '' }];
            if (type === 'ISIAN') q.key = '';
            if (type === 'BS') q.key = 'Benar';
            if (type === 'TT') q.key = 'Tepat';
            editorQuestions.push(q);
            renderEditorQuestions();
        };

        window.removeGraderQ = function(idx) {
            editorQuestions.splice(idx, 1);
            renderEditorQuestions();
        };

        function renderEditorQuestions() {
            const c = document.getElementById('ge-questions-container');
            c.innerHTML = '';
            editorQuestions.forEach((q, idx) => {
                const el = document.createElement('div');
                el.className = 'bg-slate-950 p-5 rounded-xl border border-slate-800';
                
                let html = `
                    <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                        <span class="font-bold text-sm text-slate-300">Soal ${idx + 1} <span class="bg-blue-900/50 text-blue-400 text-[10px] px-2 py-0.5 rounded ml-2">${q.type}</span></span>
                        <button onclick="window.removeGraderQ(${idx})" class="text-rose-400 hover:text-white"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                    <textarea oninput="window.updateGQ(${idx}, 'text', this.value)" placeholder="Teks pertanyaan / konteks soal..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500 mb-3">${q.text || ''}</textarea>
                `;

                if (q.type === 'PG') {
                    html += `<div class="flex gap-2">` + ['A','B','C','D','E'].map(opt => `<button onclick="window.updateGQ(${idx}, 'key', '${opt}'); window.reRenderEditor()" class="w-8 h-8 rounded-lg font-bold text-xs ${q.key === opt ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 border border-slate-700'}">${opt}</button>`).join('') + `</div>`;
                } 
                else if (q.type === 'PGK') {
                    const keys = Array.isArray(q.key) ? q.key : [];
                    html += `<div class="flex gap-2">` + ['A','B','C','D','E'].map(opt => `<button onclick="window.toggleGQ_PGK(${idx}, '${opt}')" class="w-8 h-8 rounded-lg font-bold text-xs ${keys.includes(opt) ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400 border border-slate-700'}">${opt}</button>`).join('') + `</div>`;
                }
                else if (q.type === 'JODOH') {
                    const pairs = q.pairs || [{p:'', r:''}];
                    html += `<div class="space-y-2">`;
                    pairs.forEach((p, pIdx) => {
                        html += `
                            <div class="flex gap-2 items-center">
                                <input type="text" value="${p.p}" oninput="window.updateGQ_JODOH(${idx}, ${pIdx}, 'p', this.value)" placeholder="Premis" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white outline-none focus:border-blue-500">
                                <i class="fa-solid fa-arrow-right text-slate-500 text-xs"></i>
                                <input type="text" value="${p.r}" oninput="window.updateGQ_JODOH(${idx}, ${pIdx}, 'r', this.value)" placeholder="Respons (Kunci)" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white outline-none focus:border-blue-500">
                                <button onclick="window.removeGQ_JODOH(${idx}, ${pIdx})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `;
                    });
                    html += `</div><button onclick="window.addGQ_JODOH(${idx})" class="mt-2 text-[10px] text-blue-400 font-bold">+ Tambah Pasangan</button>`;
                }
                else if (q.type === 'ISIAN') {
                    html += `<input type="text" value="${q.key || ''}" oninput="window.updateGQ(${idx}, 'key', this.value)" placeholder="Kunci Jawaban Teks..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500">`;
                }
                else if (q.type === 'BS') {
                    html += `<div class="flex gap-2">` + ['Benar','Salah'].map(opt => `<button onclick="window.updateGQ(${idx}, 'key', '${opt}'); window.reRenderEditor()" class="px-4 py-2 rounded-lg font-bold text-xs ${q.key === opt ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 border border-slate-700'}">${opt}</button>`).join('') + `</div>`;
                }
                else if (q.type === 'TT') {
                    html += `<div class="flex gap-2">` + ['Tepat','Tidak Tepat'].map(opt => `<button onclick="window.updateGQ(${idx}, 'key', '${opt}'); window.reRenderEditor()" class="px-4 py-2 rounded-lg font-bold text-xs ${q.key === opt ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 border border-slate-700'}">${opt}</button>`).join('') + `</div>`;
                }

                html += `<div class="mt-4 flex items-center gap-2"><span class="text-[10px] text-slate-500 font-bold uppercase">Bobot Nilai:</span><input type="number" min="1" value="${q.weight}" onchange="window.updateGQ(${idx}, 'weight', parseInt(this.value))" class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-center text-white outline-none"></div>`;

                el.innerHTML = html;
                c.appendChild(el);
            });
        }

        window.updateGQ = function(idx, field, val) { editorQuestions[idx][field] = val; };
        window.reRenderEditor = function() { renderEditorQuestions(); };
        window.toggleGQ_PGK = function(idx, opt) {
            let keys = Array.isArray(editorQuestions[idx].key) ? editorQuestions[idx].key : [];
            if(keys.includes(opt)) keys = keys.filter(k => k !== opt); else keys.push(opt);
            editorQuestions[idx].key = keys;
            renderEditorQuestions();
        };
        window.addGQ_JODOH = function(idx) { 
            if(!editorQuestions[idx].pairs) editorQuestions[idx].pairs = [];
            editorQuestions[idx].pairs.push({p:'', r:''}); 
            renderEditorQuestions(); 
        };
        window.updateGQ_JODOH = function(idx, pIdx, f, v) { editorQuestions[idx].pairs[pIdx][f] = v; };
        window.removeGQ_JODOH = function(idx, pIdx) { editorQuestions[idx].pairs.splice(pIdx, 1); renderEditorQuestions(); };

        window.generateGraderAI = function() {
            const topic = document.getElementById('ge-ai-topic').value || 'Materi Umum';
            const mockQ = [
                { id: 'q_ai_1', type: 'PG', text: `Pertanyaan PG AI Simulasi tentang: ${topic}\nA. Opsi 1\nB. Opsi 2\nC. Opsi 3\nD. Opsi 4\nE. Opsi 5`, key: 'A', weight: 1 },

                { id: 'q_ai_3', type: 'JODOH', text: `Jodohkan pernyataan terkait: ${topic}`, pairs: [{p:'Premis 1', r:'Respons 1'}, {p:'Premis 2', r:'Respons 2'}], weight: 1 },
                { id: 'q_ai_4', type: 'ISIAN', text: `Sebutkan satu hal penting tentang: ${topic}`, key: 'Penting', weight: 1 }
            ];
            editorQuestions.push(...mockQ);
            renderEditorQuestions();
            window.showToast('AI Berhasil merancang 4 soal simulasi.');
            document.getElementById('ge-ai-topic').value = '';
        };

        window.saveGraderExam = async function() {
            const data = {
                title: document.getElementById('ge-title').value || 'Untitled',
                className: document.getElementById('ge-class').value || 'Tanpa Kelas',
                topic: document.getElementById('ge-topic').value || '',
                kkm: parseInt(document.getElementById('ge-kkm').value) || 75,
                questions: editorQuestions,
                userId: currentUser ? currentUser.uid : 'mock-guru'
            };
            if(is_preview) {
                if(currentExamId) {
                    const idx = window.mockData.exams.findIndex(x => x.id === currentExamId);
                    if(idx > -1) window.mockData.exams[idx] = {id: currentExamId, ...data};
                } else {
                    window.mockData.exams.push({id: 'e_'+Date.now(), ...data});
                }
                window.showToast('Instrumen tersimpan.');
                window.navGrader('dashboard');
                currentExamId = null;
            } else {
                try {
                    if(currentExamId) {
                        await setDoc(doc(db, 'exams', currentExamId), data);
                    } else {
                        await addDoc(collection(db, 'exams'), data);
                    }
                    window.showToast('Kunci jawaban berhasil disimpan ke Cloud!');
                    window.navGrader('dashboard');
                    currentExamId = null;
                } catch(err) {
                    window.showToast(err.message, 'error');
                }
            }
        };

                    <div class="flex justify-between items-center mb-3">
                        <span class="font-bold text-sm text-slate-300">Soal ${idx+1} <span class="bg-blue-500/10 border border-blue-500/20 text-blue-400 px-2 py-0.5 rounded text-[10px] ml-2 uppercase">${q.type}</span></span>
                    </div>
                    ${q.text ? `<div class="text-xs text-slate-400 mb-4 whitespace-pre-wrap bg-slate-900 p-3 rounded-lg">${q.text}</div>` : ''}`;
                
                if(q.type === 'PG') {
                    html += `<div class="flex gap-2 ans-pg">` + ['A','B','C','D','E'].map(opt => `<button onclick="window.gk_selectPG(this)" data-val="${opt}" class="w-10 h-10 rounded-lg font-bold text-slate-400 bg-slate-900 border border-slate-700 hover:bg-slate-800 transition">${opt}</button>`).join('') + `</div>`;
                }
                else if(q.type === 'PGK') {
                    html += `<div class="flex gap-2 ans-pgk">` + ['A','B','C','D','E'].map(opt => `<button onclick="window.gk_togglePGK(this)" data-val="${opt}" class="w-10 h-10 rounded-lg font-bold text-slate-400 bg-slate-900 border border-slate-700 hover:bg-slate-800 transition">${opt}</button>`).join('') + `</div>`;
                }
                else if(q.type === 'JODOH') {
                    const pairs = q.pairs || [];
                    html += `<div class="space-y-2 ans-jodoh">` + pairs.map((p, pIdx) => `
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-slate-400 w-1/3 truncate bg-slate-900 p-2 rounded border border-slate-800" title="${p.p}">${p.p}</span>
                            <i class="fa-solid fa-arrow-right text-slate-600 text-[10px]"></i>
                            <input type="text" data-pidx="${pIdx}" placeholder="Jawaban siswa..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white outline-none focus:border-blue-500">
                        </div>
                    `).join('') + `</div>`;
                }
                else if(q.type === 'ISIAN') {
                    html += `<input type="text" class="ans-isian w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white outline-none focus:border-blue-500" placeholder="Ketik jawaban singkat siswa...">`;
                }
                else if(q.type === 'BS') {
                    html += `<div class="flex gap-2 ans-bs">` + ['Benar','Salah'].map(opt => `<button onclick="window.gk_selectBS(this)" data-val="${opt}" class="px-4 py-2 rounded-lg font-bold text-slate-400 bg-slate-900 border border-slate-700 hover:bg-slate-800 transition">${opt}</button>`).join('') + `</div>`;
                }
                else if(q.type === 'TT') {
                    html += `<div class="flex gap-2 ans-tt">` + ['Tepat','Tidak Tepat'].map(opt => `<button onclick="window.gk_selectTT(this)" data-val="${opt}" class="px-4 py-2 rounded-lg font-bold text-slate-400 bg-slate-900 border border-slate-700 hover:bg-slate-800 transition">${opt}</button>`).join('') + `</div>`;
                }
                return html + `</div>`;
            }).join('');
            
            window.navGrader('koreksi');
        };

        window.gk_selectPG = function(btn) {
            const parent = btn.closest('.ans-pg');
            parent.querySelectorAll('button').forEach(b => { b.classList.remove('bg-blue-600', 'text-white', 'border-transparent'); b.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-700'); b.dataset.sel = 'false'; });
            btn.classList.remove('bg-slate-900', 'text-slate-400', 'border-slate-700'); btn.classList.add('bg-blue-600', 'text-white', 'border-transparent'); btn.dataset.sel = 'true';
        };

        window.gk_selectBS = function(btn) {
            const parent = btn.closest('.ans-bs');
            parent.querySelectorAll('button').forEach(b => { b.classList.remove('bg-blue-600', 'text-white', 'border-transparent'); b.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-700'); b.dataset.sel = 'false'; });
            btn.classList.remove('bg-slate-900', 'text-slate-400', 'border-slate-700'); btn.classList.add('bg-blue-600', 'text-white', 'border-transparent'); btn.dataset.sel = 'true';
        };

        window.gk_selectTT = function(btn) {
            const parent = btn.closest('.ans-tt');
            parent.querySelectorAll('button').forEach(b => { b.classList.remove('bg-blue-600', 'text-white', 'border-transparent'); b.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-700'); b.dataset.sel = 'false'; });
            btn.classList.remove('bg-slate-900', 'text-slate-400', 'border-slate-700'); btn.classList.add('bg-blue-600', 'text-white', 'border-transparent'); btn.dataset.sel = 'true';
        };

        window.calculateGraderScore = async function() {
            const stuName = document.getElementById('gk-student').value.trim();
            if(!stuName) return window.showToast('Masukkan nama siswa terlebih dahulu!', 'error');

            const e = graderExams.find(x => x.id === currentExamId);
            const items = document.querySelectorAll('.grader-item');
            let totalScore = 0, maxScore = 0;

            items.forEach(item => {
                const idx = parseInt(item.dataset.idx);
                const q = e.questions[idx];
                const w = parseInt(q.weight) || 1;
                maxScore += w;
                let earned = 0;

                if(q.type === 'PG') {
                    const sel = item.querySelector('.ans-pg button[data-sel="true"]');
                    if(sel && sel.dataset.val === q.key) earned = w;
                } else if(q.type === 'PGK') {
                    const sels = Array.from(item.querySelectorAll('.ans-pgk button[data-sel="true"]')).map(b => b.dataset.val);
                    const keys = Array.isArray(q.key) ? q.key : [];
                    if(sels.length === keys.length && sels.every(v => keys.includes(v))) earned = w;
                } else if(q.type === 'JODOH') {
                    const inps = item.querySelectorAll('.ans-jodoh input');
                    let cPairs = 0;
                    const pairs = q.pairs || [];
                    inps.forEach(inp => {
                        const pIdx = parseInt(inp.dataset.pidx);
                        if(pairs[pIdx] && inp.value.trim().toLowerCase() === pairs[pIdx].r.toLowerCase().trim() && pairs[pIdx].r !== '') cPairs++;
                    });
                    if(pairs.length > 0) earned = (cPairs / pairs.length) * w;
                } else if(q.type === 'ISIAN') {
                    const val = item.querySelector('.ans-isian').value.trim().toLowerCase();
                    if(val === (q.key||'').toLowerCase().trim() && (q.key||'') !== '') earned = w;
                } else if(q.type === 'BS') {
                    const sel = item.querySelector('.ans-bs button[data-sel="true"]');
                    if(sel && sel.dataset.val === q.key) earned = w;
                } else if(q.type === 'TT') {
                    const sel = item.querySelector('.ans-tt button[data-sel="true"]');
                    if(sel && sel.dataset.val === q.key) earned = w;
                }
                totalScore += earned;
            });

            const final = maxScore > 0 ? Math.round((totalScore / maxScore) * 100) : 0;
            const isTuntas = final >= (e.kkm || 75);

            document.getElementById('res-score').textContent = final;
            document.getElementById('res-score').className = `text-7xl font-black mb-2 ${isTuntas ? 'text-emerald-400 drop-shadow-[0_0_15px_rgba(52,211,153,0.5)]' : 'text-rose-400 drop-shadow-[0_0_15px_rgba(244,63,94,0.5)]'}`;
            const statEl = document.getElementById('res-status');
            statEl.textContent = isTuntas ? 'TUNTAS' : 'REMEDIAL';
            statEl.className = `mb-6 inline-block px-4 py-1 rounded-full text-xs font-bold border ${isTuntas ? 'bg-emerald-900/30 text-emerald-400 border-emerald-500/50' : 'bg-rose-900/30 text-rose-400 border-rose-500/50'}`;
            document.getElementById('res-detail').innerHTML = `Skor Mentah: <b class="text-white">${totalScore.toFixed(2)}</b> / ${maxScore}`;

            const dateStr = new Date().toISOString().split('T')[0];
            const syncTopik = e.topic ? `Ujian: ${e.title} (${e.topic})` : `Ujian: ${e.title}`;
            const syncKelas = e.className || 'Tanpa Kelas';

            if (is_preview) {
                const existingGrade = window.mockData.grades.find(g => g.topik === syncTopik && g.kelas === syncKelas && g.userId === currentUser.uid);
                if (existingGrade) {
                    const sIdx = existingGrade.dataSiswa.findIndex(s => s.nama === stuName);
                    if (sIdx > -1) existingGrade.dataSiswa[sIdx].nilai = final;
                    else existingGrade.dataSiswa.push({ nama: stuName, nilai: final });
                } else {
                    window.mockData.grades.push({
                        id: 'g_' + Date.now(),
                        kelas: syncKelas,
                        topik: syncTopik,
                        tanggal: dateStr,
                        dataSiswa: [{ nama: stuName, nilai: final }],
                        userId: currentUser.uid
                    });
                }
                loadGuruGrades();
            } else {
                try {
                    const qRef = query(collection(db, 'users', currentUser.uid, 'grades'), where('topik', '==', syncTopik), where('kelas', '==', syncKelas));
                    const snap = await getDocs(qRef);
                    if (!snap.empty) {
                        const docTarget = snap.docs[0];
                        let dataSiswa = docTarget.data().dataSiswa || [];
                        let sIdx = dataSiswa.findIndex(s => s.nama === stuName);
                        if(sIdx > -1) dataSiswa[sIdx].nilai = final;
                        else dataSiswa.push({nama: stuName, nilai: final});
                        await updateDoc(doc(db, 'users', currentUser.uid, 'grades', docTarget.id), { dataSiswa });
                    } else {
                        await addDoc(collection(db, 'users', currentUser.uid, 'grades'), {
                            kelas: syncKelas,
                            topik: syncTopik,
                            tanggal: dateStr,
                            dataSiswa: [{ nama: stuName, nilai: final }],
                            userId: currentUser.uid
                        });
                    }
                } catch(err) {
                    console.error("Auto-sync error:", err);
                }
            }

            document.getElementById('grader-result-modal').classList.remove('hidden');
        };

        window.closeGraderModal = function(nextStudent) {
            document.getElementById('grader-result-modal').classList.add('hidden');
            if (nextStudent) {
                document.getElementById('gk-student').value = '';
                document.querySelectorAll('.ans-pg button, .ans-pgk button').forEach(b => {
                    b.classList.remove('bg-blue-600', 'bg-emerald-600', 'text-white', 'border-transparent');
                    b.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-700');
                    b.dataset.sel = 'false';
                });
                document.querySelectorAll('.ans-jodoh input, .ans-isian').forEach(i => i.value = '');
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        };

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
