<script>
const GAS_API_URL = "https://script.google.com/macros/s/AKfycby9JgMYykIicXsoMlaAj8UH-W5FdwssDZOGj3p0BIBxSaM1-gKZHNuzf6VIqh-mY8vD/exec";

const localDb = {
  identitasSekolah: { nama: "MAS Jurnal Studio Pro", npsn: "12345678", alamat: "Jl. Pembuat Aplikasi Web No. 42, AI City", kepsek: "Dr. H. Suhardy Amir, M.Pd." },

    { id: "j3", nama: "Jurnal Penilaian Harian", desc: "Merekam nilai kuis harian, kompetensi dasar, dan capaian harian siswa." },
    { id: "j4", nama: "Jurnal Remedial", desc: "Program tindak lanjut perbaikan nilai untuk siswa di bawah KKM." },
    { id: "j5", nama: "Jurnal Pengayaan", desc: "Materi pengayaan atau pembelajaran tingkat lanjut bagi siswa berprestasi." },
    { id: "j6", nama: "Jurnal Refleksi Guru", desc: "Dokumentasi kelemahan, kelebihan, dan perbaikan performa mengajar." },
    { id: "j7", nama: "Jurnal Penggunaan Media Pembelajaran", desc: "Inventarisasi dan utilisasi efektivitas media teknologi/alat peraga." },
    { id: "j8", nama: "Jurnal Projek Kokurikuler", desc: "Pencatatan perkembangan projek kokurikuler atau P5 yang sedang berjalan." },
    { id: "j9", nama: "Jurnal Kasus Siswa", desc: "Catatan khusus pelanggaran atau penanganan kejadian khusus pada siswa." },
    { id: "j10", nama: "Jurnal Komunikasi Orang Tua", desc: "Notulensi dialog serta solusi bersama dengan orang tua/wali murid." }
  ],
  isiJurnal: [
    { id: "R001", jurnalId: "j1", guruId: "U002", guruNama: "Ahmad Saefudin, S.Pd.", tanggal: "2026-07-09", kelas: "XI-A", mapel: "Informatika", metode: "Project-Based Learning", materi: "Algoritma Pemrograman Sederhana", catatan: "Siswa sangat antusias melakukan modul lab.", evaluasi: "Bagus sekali, pertahankan media simulasi interaktif." },
    { id: "R002", jurnalId: "j2", guruId: "U002", guruNama: "Ahmad Saefudin, S.Pd.", tanggal: "2026-07-09", kelas: "XI-A", mapel: "Informatika", metode: "Tatap Muka Kontrol", materi: "Sakit: Budi, Izin: Clara", catatan: "Hadir: 32, Tidak Hadir: 2", evaluasi: "" },
    { id: "R003", jurnalId: "j1", guruId: "U003", guruNama: "Siti Rahmawati, M.Pd.", tanggal: "2026-07-08", kelas: "X-B", mapel: "Matematika", metode: "Problem Based Learning", materi: "Fungsi Eksponen Matematika", catatan: "Beberapa siswa kesulitan di penyamaan basis aljabar.", evaluasi: "Dianjurkan mengadakan program kelas remedial terarah." }
  ]
};

let userSession = null;
let activeMenu = "dashboard";
window.cachedJurnalAdmin = [];
window.cachedJurnalGuru = [];
window.cachedIdentitas = {};
window.APP_DATA = { identitas: {}, users: [], jurnal: [] };

window.onload = function() {
  updateSystemModeUi();
  lucide.createIcons();
};

async function callApi(payload) {
  if (typeof google !== "undefined" && google.script && google.script.run) {
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler((responseStr) => resolve(JSON.parse(responseStr)))
        .withFailureHandler((err) => {
          console.error("Gagal memanggil fungsi Apps Script:", err);
          showToast("Koneksi Google Apps Script bermasalah.", "error");
          resolve({ success: false, message: err.toString() });
        })
        .executeAction(JSON.stringify(payload));
    });
  }
  
  if (GAS_API_URL && GAS_API_URL !== "tempel") {
    try {
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error("HTTP status " + response.status);
      const data = await response.json();
      return data;
    } catch (error) {
      console.error("Gagal terhubung ke API:", error);
      showToast("Gagal terhubung ke database online.", "error");
      return { success: false, message: error.toString() };
    }
  }
  
  return await mockLocalApi(payload);
}

function mockLocalApi(payload) {
  return new Promise((resolve) => {
    setTimeout(() => {
      const act = payload.action;
      if (act === "login") {
        const found = localDb.users.find(x => x.username === payload.username && x.password === payload.password);
        if (found) {
          resolve({ success: true, user: found });
        } else {
          resolve({ success: false, message: "Username atau Password salah!" });
        }
      } else if (act === "getBulkData") {
        resolve({ success: true, identitas: localDb.identitasSekolah, users: localDb.users, jurnal: localDb.isiJurnal });
      } else if (act === "getIdentitas") {
        resolve({ success: true, data: localDb.identitasSekolah });
      } else if (act === "saveIdentitas") {
        localDb.identitasSekolah = payload.data;
        resolve({ success: true, message: "Berhasil update identitas sekolah!" });
      } else if (act === "getUsers") {
        resolve({ success: true, data: localDb.users });
      } else if (act === "addUser") {
        const newId = "U" + String(localDb.users.length + 1).padStart(3, '0');
        localDb.users.push({ id: newId, username: payload.data.username, password: payload.data.password, nama: payload.data.nama, role: "Guru" });
        resolve({ success: true, message: "Guru berhasil didaftarkan!" });
      } else if (act === "getJurnal") {
        let filtered = localDb.isiJurnal;
        if (payload.role === "Guru") {
          filtered = localDb.isiJurnal.filter(x => x.guruId === payload.guruId);
        }
        resolve({ success: true, data: filtered });
      } else if (act === "addJurnal") {
        const newId = "R" + String(localDb.isiJurnal.length + 1).padStart(3, '0');
        localDb.isiJurnal.push({ id: newId, jurnalId: payload.data.jurnalId, guruId: payload.data.guruId, guruNama: payload.data.guruNama, tanggal: payload.data.tanggal, kelas: payload.data.kelas, mapel: payload.data.mapel || "-", metode: payload.data.metode || "-", materi: payload.data.materi, catatan: payload.data.catatan, evaluasi: "" });
        resolve({ success: true, message: "Laporan jurnal tersimpan di database lokal!" });
      } else if (act === "saveEvaluasi") {
        const item = localDb.isiJurnal.find(x => x.id === payload.id);
        if (item) {
          item.evaluasi = payload.evaluasi;
          resolve({ success: true, message: "Evaluasi tersimpan!" });
        } else {
          resolve({ success: false, message: "Item jurnal tidak ditemukan!" });
        }
      } else {
        resolve({ success: false, message: "Aksi Simulasi tidak didukung!" });
      }
    }, 350);
  });
}

function updateSystemModeUi() {
  const topbarBadge = document.getElementById("topbar-api-indicator");
  const isLiveInGas = (typeof google !== "undefined" && google.script && google.script.run);
  if (topbarBadge) {
    if (isLiveInGas) {
      topbarBadge.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span> Google Sheets Terhubung`;
      topbarBadge.className = "text-[10px] px-2.5 py-1 rounded-full font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-1.5";
    } else {
      topbarBadge.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-amber-500 animate-pulse"></span> Mode Demo`;
      topbarBadge.className = "text-[10px] px-2.5 py-1 rounded-full font-bold bg-amber-50 text-amber-700 border border-amber-200 flex items-center gap-1.5";
    }
  }
}

function togglePasswordVisibility() {
  const inp = document.getElementById("login-password");
  const icon = document.getElementById("password-toggle-icon");
  if (inp.type === "password") { inp.type = "text"; icon.setAttribute("data-lucide", "eye-off"); } 
  else { inp.type = "password"; icon.setAttribute("data-lucide", "eye"); }
  lucide.createIcons();
}

// LOGIN DENGAN getBulkData
async function handleLogin(e) {
  e.preventDefault();
  showLoading(true, "Memeriksa identitas Anda...");
  
  const u = document.getElementById("login-username").value;
  const p = document.getElementById("login-password").value;
  
  const res = await callApi({ action: "login", username: u, password: p });
  showLoading(false);
  
  if (!res.success) {
    showToast(res.message || "Gagal login.", "error");
    return;
  }
  
  userSession = res.user;
  showLoading(true, "Memuat data dashboard...");
  
  // PANGGIL getBulkData SEKARANG!
  const bulkRes = await callApi({ action: "getBulkData", role: userSession.role, guruId: userSession.id });
  showLoading(false);
  
  if (!bulkRes.success) {
    showToast("Gagal memuat data dashboard.", "error");
    return;
  }
  
  // SIMPAN DI window.APP_DATA
  window.APP_DATA = {
    identitas: bulkRes.identitas || {},
    users: bulkRes.users || [],
    jurnal: bulkRes.jurnal || []
  };
  
  showToast(`Selamat datang kembali, ${userSession.nama}!`, "success");
  
  document.getElementById("page-login").classList.add("hidden");
  document.getElementById("page-app").classList.remove("hidden");
  
  document.getElementById("user-display-name").innerText = userSession.nama;
  document.getElementById("user-display-role").innerText = userSession.role;
  document.getElementById("user-avatar").innerText = userSession.nama.charAt(0).toUpperCase();
  
  buildAppShellNavigation();
  navigateTo("dashboard");
}

function handleLogout() {
  userSession = null;
  window.APP_DATA = { identitas: {}, users: [], jurnal: [] };
  document.getElementById("page-app").classList.add("hidden");
  document.getElementById("page-login").classList.remove("hidden");
  showToast("Berhasil keluar dari sesi.", "info");
  updateSystemModeUi();
}

function buildAppShellNavigation() {
  const dNav = document.getElementById("desktop-menu-list");
  const mNav = document.getElementById("mobile-menu-list");
  
  let menus = [
    { id: "dashboard", label: "Dashboard", icon: "layout-dashboard" },
    { id: "identitas", label: "Identitas", icon: "school" }
  ];
  
  if (userSession.role === "Admin") {
    menus.push({ id: "jurnal-all", label: "Semua Jurnal", icon: "book-open-check" });
    menus.push({ id: "tambah-user", label: "Tambah Guru", icon: "user-plus" });
  } else {
    menus.push({ id: "jurnal-guru-form", label: "10 Jurnal", icon: "pencil-line" });
    menus.push({ id: "evaluasi-saya", label: "Cetak & Evaluasi", icon: "printer" });
  }
  
  dNav.innerHTML = menus.map(m => `
    <button onclick="navigateTo('${m.id}')" id="menu-dk-${m.id}" class="menu-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-800 hover:text-white shrink-0">
      <i data-lucide="${m.icon}" class="h-4 w-4 shrink-0"></i>
      <span class="sidebar-text animate-in fade-in duration-200">${m.label}</span>
    </button>
  `).join("");
  
  mNav.innerHTML = menus.map(m => `
    <button onclick="navigateTo('${m.id}')" id="menu-mb-${m.id}" class="flex flex-col items-center justify-center text-[10px] text-slate-400 font-medium py-1 transition flex-1">
      <i data-lucide="${m.icon}" class="h-5 w-5 mb-1"></i>
      <span>${m.label}</span>
    </button>
  `).join("");
  
  lucide.createIcons();
}

function navigateTo(menuId) {
  activeMenu = menuId;
  document.querySelectorAll("[id^='menu-dk-'], [id^='menu-mb-']").forEach(el => {
    el.classList.remove("text-white", "bg-slate-800", "text-indigo-500");
    el.classList.add("text-slate-400");
  });
  
  const activeD = document.getElementById(`menu-dk-${menuId}`);
  const activeM = document.getElementById(`menu-mb-${menuId}`);
  
  if (activeD) {
    activeD.classList.remove("text-slate-400");
    activeD.classList.add("text-white", "bg-slate-800");
  }
  if (activeM) {
    activeM.classList.remove("text-slate-400");
    activeM.classList.add("text-indigo-400");
  }
  
  renderViewContent(menuId);
}

async function renderViewContent(menuId) {
  const parent = document.getElementById("main-content-workspace");
  const title = document.getElementById("topbar-title");
  
  if (menuId === "dashboard") {
    title.innerText = "Dashboard Utama";
    
    // AMBIL DARI window.APP_DATA, NGGAK PERLU MANGGIL API LAGI!
    const jRes = { success: true, data: window.APP_DATA.jurnal };
    const uRes = { success: true, data: window.APP_DATA.users };
    
    const totalIsi = jRes.success ? jRes.data.length : 0;
    const totalGuru = uRes.success ? uRes.data.filter(x => x.role === "Guru").length : 0;
    const totalEvaluasi = jRes.success ? jRes.data.filter(x => x.evaluasi !== "").length : 0;
    
    parent.innerHTML = `
      <div class="space-y-6">
        <div class="bg-gradient-to-r from-indigo-900 to-indigo-800 rounded-3xl p-6 md:p-8 text-white relative overflow-hidden shadow-xl shadow-slate-100">
          <div class="relative z-10 space-y-2">
            <span class="text-xs font-bold tracking-wider uppercase text-indigo-200">SISTEM INFORMASI MANAJEMEN</span>
            <h3 class="text-2xl md:text-3xl font-extrabold">Selamat Bekerja, ${userSession.nama}</h3>
            <p class="text-xs md:text-sm text-indigo-100 max-w-xl">Aplikasi 10 Jurnal Guru digital memfasilitasi monitoring, perekaman kinerja secara rapi, dan kemudahan pengisian dalam 1 platform.</p>
          </div>
          <div class="absolute -right-8 -bottom-8 text-indigo-700/30 opacity-60">
            <i data-lucide="book-open" style="width:180px; height:180px;"></i>

async function handleSaveIdentitas(e) {
  e.preventDefault();
  showLoading(true, "Menyimpan data identitas...");
  
  const payload = {
    nama: document.getElementById("iden-nama").value,
    npsn: document.getElementById("iden-npsn").value,
    alamat: document.getElementById("iden-alamat").value,
    kepsek: document.getElementById("iden-kepsek").value
  };
  
  const res = await callApi({ action: "saveIdentitas", data: payload });
  showLoading(false);
  
  if (res.success) {
    window.APP_DATA.identitas = payload;
    showToast("Identitas sekolah berhasil diperbarui!", "success");
    renderViewContent("identitas");
  } else {
    showToast("Terjadi kendala penyimpanan.", "error");
  }
}

async function handleTambahGuru(e) {
  e.preventDefault();
  showLoading(true, "Menambahkan data guru baru...");
  
  const payload = {
    nama: document.getElementById("add-nama").value,
    username: document.getElementById("add-username").value,
    password: document.getElementById("add-password").value
  };
  
  const res = await callApi({ action: "addUser", data: payload });
  showLoading(false);
  
  if (res.success) {

async function submitJurnalForm() {
  const jId = document.getElementById("form-inp-jid").value;
  let tgl, kls, mapel, metode, mtr, ctt;
  
  if (jId === "j3") {
    tgl = new Date().toISOString().substring(0, 10);
    kls = document.getElementById("form-inp-kelas").value;
    const jenisAsesmen = document.getElementById("form-inp-jenis-asesmen").value;
    const kde = document.getElementById("form-inp-kde").value;
    const rekap = document.getElementById("form-inp-rekap").value;
    
    if (!kls || !jenisAsesmen || !kde || !rekap) {
      showToast("Mohon lengkapi semua bidang bertanda bintang!", "error");
      return;
    }
    
    mapel = "Penilaian Harian";
    metode = jenisAsesmen;
    mtr = `Lingkup Materi: ${kde}`;
    ctt = `Rekap Nilai: ${rekap}`;
  } else {
    tgl = document.getElementById("form-inp-tanggal").value;
    kls = document.getElementById("form-inp-kelas").value;
    mapel = document.getElementById("form-inp-mapel").value;
    metode = document.getElementById("form-inp-metode").value;
    mtr = document.getElementById("form-inp-materi").value;
    ctt = document.getElementById("form-inp-catatan").value;
    
    if (!kls || !mtr || !mapel || !metode) {
      showToast("Mohon lengkapi seluruh field isian termasuk Mata Pelajaran dan Metode Pembelajaran!", "error");
      return;
    }
  }
  
  showLoading(true, "Mengirim ke Google Sheets...");
  
  const payload = {
    jurnalId: jId,
    guruId: userSession.id,
    guruNama: userSession.nama,
    tanggal: tgl,
    kelas: kls,
    mapel: mapel,
    metode: metode,
    materi: mtr,
    catatan: ctt
  };
  
  const res = await callApi({ action: "addJurnal", data: payload });
  showLoading(false);
  
  if (res.success) {
    const newItem = { ...payload, id: "R" + Date.now(), evaluasi: "" };
    window.APP_DATA.jurnal.push(newItem);
    
    showToast("Laporan jurnal sukses tersimpan!", "success");
    closeModal();
    renderViewContent("jurnal-guru-form");
  } else {
    showToast("Terjadi kegagalan koneksi database.", "error");
  }
}

async function submitSaveEvaluasi() {
  const targetId = document.getElementById("eval-target-id").value;
  const textVal = document.getElementById("eval-inp-text").value;
  
  if (!textVal.trim()) {
    showToast("Catatan evaluasi tidak boleh kosong!", "error");
    return;
  }
  
  showLoading(true, "Menyimpan evaluasi...");
  
  const res = await callApi({ action: "saveEvaluasi", id: targetId, evaluasi: textVal });
  showLoading(false);
  
  if (res.success) {
    const item = window.APP_DATA.jurnal.find(x => x.id === targetId);
    if (item) item.evaluasi = textVal;
    
    showToast("Evaluasi berhasil disimpan ke sheet!", "success");
    closeModal();
    renderViewContent("jurnal-all");
  } else {
    showToast("Gagal menyimpan evaluasi.", "error");
  }
}

function showToast(message, type = "success") {
  const container = document.getElementById("toast-layer");
  const toast = document.createElement("div");
  let badgeStyle = "border-l-emerald-500 text-emerald-800";
  let icon = "check-circle-2";
  
  if (type === "error") {
    badgeStyle = "border-l-rose-500 text-rose-800";
    icon = "alert-circle";
  } else if (type === "info") {
    badgeStyle = "border-l-blue-500 text-blue-800";
    icon = "info";
  }
  
  toast.className = `flex items-center gap-3 bg-white border border-slate-100 border-l-4 ${badgeStyle} px-5 py-4 rounded-2xl shadow-xl w-80 animate-in slide-in-from-right-10 duration-300 pointer-events-auto`;
  toast.innerHTML = `<i data-lucide="${icon}" class="h-5 w-5 shrink-0"></i><p class="text-xs font-semibold leading-relaxed">${message}</p>`;
  
  container.appendChild(toast);
  lucide.createIcons();
  
  setTimeout(() => {
    toast.classList.add("animate-out", "fade-out-0", "translate-x-10", "duration-200");
    setTimeout(() => toast.remove(), 200);
  }, 4000);
}

function showLoading(show, text = "Memproses...") {
  const el = document.getElementById("loading-overlay");
  document.getElementById("loading-text").innerText = text;
  if (show) el.classList.remove("hidden"); else el.classList.add("hidden");
}

function closeModal() {
  document.getElementById("modal-layer").classList.add("hidden");
}

function toggleSidebar() {
  const sidebar = document.getElementById("app-sidebar");
  if (sidebar) {
    sidebar.classList.toggle("collapsed");
  }
}
</script>
</body>
</html>
