        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl text-xs font-semibold shadow-xl border flex items-center space-x-2 transition transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-950/90 border-emerald-500/30 text-emerald-300' : 'bg-rose-950/90 border-rose-500/30 text-rose-300'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'} text-sm"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

            const msg = input.value.trim();
            if(!msg) return;

            if (is_preview) {
                const jIdx = window.mockData.journals.findIndex(j => j.id === journalId);
                if(jIdx > -1) {
                    window.mockData.journals[jIdx].adminNotes = msg;
                    input.value = '';
                    window.showToast('Catatan terkirim!', 'success');
                    renderAdminData();
                }
            } else {
                try {
                    if (db) {
                        await updateDoc(doc(db, 'users', teacherId, 'journals', journalId), {
                            adminNotes: msg
                        });
                    }
                    input.value = '';
                    window.showToast('Catatan terkirim ke cloud!', 'success');
                } catch(err) {
                    window.showToast(err.message, 'error');
                }
            }
        };

        window.sendJournalReaction = async function(journalId, emoji) {
            const readTime = new Date().toLocaleDateString('id-ID', { hour: '2-digit', minute: '2-digit' });
            if (is_preview) {
                const item = window.mockData.journals.find(j => j.id === journalId);
                if (item) {
                    item.adminNotesReaction = emoji;
                    item.adminNotesReadAt = readTime;
                    loadGuruJournals();
                    window.showToast(`Reaksi ${emoji} terkirim! Admin dapat melihat tanda sudah dibaca.`, 'success');
                }
            } else {
                try {
                    if (db && currentUser) {
                        await setDoc(doc(db, 'users', currentUser.uid, 'journals', journalId), {
                            adminNotesReaction: emoji,
                            adminNotesReadAt: readTime
                        }, { merge: true });
                        window.showToast(`Reaksi ${emoji} terkirim!`, 'success');

                } catch(err) {
                    window.showToast(err.message, 'error');
                }
            }
        };

        window.sendAdminEvaluation = async function(e, teacherId) {
            e.preventDefault();
            const input = document.getElementById(`eval-msg-${teacherId}`);
            const msg = input.value.trim();
            if(!msg) return;

            const evalObj = {
                message: msg,
                date: new Date().toISOString().split('T')[0],
                adminName: currentUser.name || 'Kepala Madrasah',
                isRead: false,
                reaction: '',
                reply: '',
                readAt: ''
            };

            if (is_preview) {
                window.mockData.evaluations.push({ id: 'eval_' + Date.now(), teacherId, ...evalObj });
                adminCachedEvaluations = window.mockData.evaluations;
                input.value = '';
                window.showToast('Catatan evaluasi berhasil dikirim ke guru!', 'success');
                renderAdminData();
            } else {
                try {
                    if (db) await addDoc(collection(db, 'users', teacherId, 'evaluations'), evalObj);
                    input.value = '';
                    window.showToast('Catatan evaluasi berhasil dikirim ke guru!', 'success');
                } catch(err) {
                    window.showToast(err.message, 'error');

        };

        window.sendGuruReaction = async function(evalId, emoji) {

            if (is_preview) {
                const item = window.mockData.evaluations.find(e => e.id === evalId);
                if (item) {
                    item.reaction = emoji;
                    item.isRead = true;
                    item.readAt = readTime;
                    loadGuruEvaluations();
                    window.showToast(`Reaksi ${emoji} terkirim! Admin dapat melihat tanda dibaca.`, 'success');

            } else {

                            reaction: emoji,
                            isRead: true,

        function loadGuruSchedules() {
            if (is_preview) {
                cachedSchedules = (window.mockData.schedules || []).filter(s => s.userId === currentUser.uid);
                renderGuruSchedulesUI(cachedSchedules);
            } else {
                if (!db || !currentUser) return;
                onSnapshot(collection(db, 'users', currentUser.uid, 'schedules'), (snap) => {
                    cachedSchedules = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderGuruSchedulesUI(cachedSchedules);
                });
            }
        }

        function renderGuruSchedulesUI(schedules) {
            const container = document.getElementById('guru-schedule-list');
            if (!container) return;

            if (schedules.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 italic py-2">Belum ada jadwal mengajar yang ditambahkan. Silakan gunakan formulir di atas.</p>`;
                return;
            }

            const daysIndo = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const currentDayIndo = daysIndo[new Date().getDay()];

            const sorted = [...schedules].sort((a, b) => {
                const days = { 'Senin': 1, 'Selasa': 2, 'Rabu': 3, 'Kamis': 4, 'Jumat': 5, 'Sabtu': 6, 'Ahad': 7 };
                if (days[a.hari] !== days[b.hari]) return (days[a.hari] || 99) - (days[b.hari] || 99);
                return parseInt(a.jamKe || 0) - parseInt(b.jamKe || 0);
            });

            container.innerHTML = sorted.map(s => {
                const isToday = s.hari && s.hari.trim().toLowerCase() === currentDayIndo.toLowerCase();
                return `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 rounded-xl gap-2 transition-all ${isToday ? 'bg-indigo-950/60 border border-indigo-500/60 shadow-lg shadow-indigo-500/10 ring-1 ring-indigo-500/40' : 'bg-slate-950 border border-slate-800'}">
                        <div class="flex items-center gap-2.5 flex-wrap flex-1">
                            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded border whitespace-nowrap ${isToday ? 'text-indigo-200 bg-indigo-500/30 border-indigo-500/50' : 'text-blue-400 bg-blue-900/20 border-blue-800/50'}">${s.hari}</span>
                            ${isToday ? '<span class="text-[9px] font-bold bg-indigo-600 text-white px-2 py-0.5 rounded-full uppercase tracking-wider">✨ Hari Ini</span>' : ''}
                            <span class="text-[10px] text-slate-300 font-bold bg-slate-900 px-2 py-0.5 rounded border border-slate-800">Jam ke-${s.jamKe}</span>
                            <span class="text-xs text-slate-300 font-mono bg-slate-900 px-2 py-0.5 rounded border border-slate-800 whitespace-nowrap"><i class="fa-regular fa-clock text-slate-500 mr-1"></i>${s.waktu}</span>
                            <span class="text-[10px] text-emerald-400 font-bold uppercase bg-emerald-900/20 px-2 py-0.5 rounded border border-emerald-800/50 whitespace-nowrap">${s.kelas}</span>

        // =========================================================================

        // =========================================================================
        function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Radius bumi dalam meter
            const toRad = deg => (deg * Math.PI) / 180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return Math.round(R * c);
        }

        function timeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const clean = timeStr.replace('.', ':');
            const [h, m] = clean.split(':').map(Number);
            return (h || 0) * 60 + (m || 0);
        }

        window.setPresensiGpsMode = function(mode) {
            if (mode === 'REAL') {
                if (!navigator.geolocation) {
                    return window.showToast('Geolocation tidak didukung pada peramban ini.', 'error');
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const dist = calculateHaversineDistance(lat, lng, schoolSettings.lat, schoolSettings.lng);
                        gpsState = {
                            lat,
                            lng,
                            distance: dist,
                            mode: 'REAL',
                            lastChecked: new Date().toLocaleTimeString('id-ID')
                        };
                        window.showToast(`GPS Asli terbaca. Jarak: ${dist} meter ke madrasah.`, dist <= schoolSettings.radius ? 'success' : 'error');
                        renderPresensiUI();
                    },
                    (err) => {
                        window.showToast(`Gagal membaca GPS asli (${err.message}). Gunakan simulasi radius.`, 'error');
                    },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            } else if (mode === 'SIM_IN') {
                const lat = schoolSettings.lat + 0.00010;
                const lng = schoolSettings.lng + 0.00008;
                const dist = calculateHaversineDistance(lat, lng, schoolSettings.lat, schoolSettings.lng);
                gpsState = { lat, lng, distance: dist, mode: 'SIM_IN', lastChecked: new Date().toLocaleTimeString('id-ID') };
                window.showToast(`Simulasi DALAM Radius aktif (${dist} meter ke madrasah).`, 'success');
                renderPresensiUI();
            } else if (mode === 'SIM_OUT') {
                const lat = schoolSettings.lat + 0.0035;
                const lng = schoolSettings.lng + 0.0025;
                const dist = calculateHaversineDistance(lat, lng, schoolSettings.lat, schoolSettings.lng);
                gpsState = { lat, lng, distance: dist, mode: 'SIM_OUT', lastChecked: new Date().toLocaleTimeString('id-ID') };
                window.showToast(`Simulasi LUAR Radius aktif (${dist} meter). Di luar jangkauan!`, 'error');
                renderPresensiUI();
            }
        };

        window.submitClockIn = async function() {
            const todayObj = new Date();
            if (todayObj.getDay() === 0) {
                return window.showToast('Hari Ahad/Minggu adalah hari libur sekolah. Presensi tidak aktif (-).', 'error');
            }

            if (gpsState.distance > schoolSettings.radius) {
                return window.showToast(`Absen Masuk Ditolak! Anda berada ${gpsState.distance} meter dari madrasah (Maks: ${schoolSettings.radius}m).`, 'error');
            }

            const today = new Date().toISOString().split('T')[0];
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const limitMin = timeToMinutes(schoolSettings.clockInLimit);
            const currentMin = timeToMinutes(timeStr);
            const tolerance = schoolSettings.lateTolerance || 0;

            let status = 'HADIR';
            let lateMinutes = 0;
            let notes = 'Tepat waktu sesuai jadwal';

            if (currentMin > (limitMin + tolerance)) {
                status = 'TERLAMBAT';
                lateMinutes = currentMin - limitMin;
                notes = `Terlambat ${lateMinutes} menit`;
            } else if (currentMin > limitMin) {
                notes = `Toleransi kehadiran (${currentMin - limitMin} menit)`;
            }

            const attObj = {
                userId: currentUser.uid,
                date: today,
                clockIn: timeStr,
                clockOut: null,
                status,
                lateMinutes,
                distance: gpsState.distance,
                notes
            };

            if (is_preview) {
                const existing = window.mockData.attendances.find(a => a.userId === currentUser.uid && a.date === today);
                if (existing) return window.showToast('Anda sudah melakukan Absen Masuk hari ini!', 'error');

                window.mockData.attendances.unshift({ id: 'att_' + Date.now(), ...attObj });
                loadGuruAttendances();
                window.showToast(`Absen Masuk berhasil dicatat pukul ${timeStr} (${status})!`, status === 'HADIR' ? 'success' : 'error');
            } else {
                try {
                    const qAtt = query(collection(db, 'users', currentUser.uid, 'attendances'), where('date', '==', today));
                    const snap = await getDocs(qAtt);
                    if (!snap.empty) return window.showToast('Anda sudah melakukan Absen Masuk hari ini!', 'error');

                    await addDoc(collection(db, 'users', currentUser.uid, 'attendances'), attObj);
                    window.showToast(`Absen Masuk berhasil dicatat pukul ${timeStr} (${status})!`, status === 'HADIR' ? 'success' : 'error');
                } catch (err) {
                    window.showToast(err.message, 'error');
                }
            }
        };

        window.renderMatrixTable = function() {
            const sel = document.getElementById('select-kelas-matrix');
            const c = document.getElementById('matrix-table-container');
            const btnCsv = document.getElementById('btn-export-matrix');
            const btnPdf = document.getElementById('btn-export-pdf');
            if (!sel || !c) return;
            const kls = sel.value;
            if (!kls) {
                c.innerHTML = `<p class="text-xs text-slate-500 italic py-4 text-center">Pilih kelas terlebih dahulu untuk melihat matriks.</p>`;
                if (btnCsv) btnCsv.classList.add('hidden');
                if (btnPdf) btnPdf.classList.add('hidden');
                return;
            }

            if (btnCsv) btnCsv.classList.remove('hidden');
            if (btnPdf) btnPdf.classList.remove('hidden');

            const classGrades = cachedGrades.filter(g => g.kelas === kls);
            if (classGrades.length === 0) {
                c.innerHTML = `<p class="text-xs text-slate-500 italic py-4 text-center">Tidak ada sesi penilaian untuk kelas ${kls}.</p>`;
                return;
            }

            const studentMap = {};
            classGrades.forEach(g => {
                (g.dataSiswa || []).forEach(s => {
                    if (!studentMap[s.nama]) studentMap[s.nama] = {};
                    studentMap[s.nama][g.topik] = s.nilai;
                });
            });

            const students = Object.keys(studentMap).sort();
            const topics = classGrades.map(g => g.topik);

            c.innerHTML = `
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-950 text-slate-300 border-b border-slate-800">
                        <tr>
                            <th class="p-3 border-r border-slate-800">No</th>
                            <th class="p-3 border-r border-slate-800">Nama Siswa</th>
                            ${topics.map(t => `<th class="p-3 border-r border-slate-800 text-center">${t}</th>`).join('')}
                            <th class="p-3 text-center bg-indigo-950/40 text-indigo-300">Rata-Rata</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800">
                        ${students.map((st, idx) => {
                            let total = 0, count = 0;
                            topics.forEach(t => {
                                if (studentMap[st][t] !== undefined) {
                                    total += studentMap[st][t];
                                    count++;
                                }
                            });
                            const avg = count > 0 ? (total / count).toFixed(1) : '-';
                            return `
                                <tr class="hover:bg-slate-800/30">
                                    <td class="p-3 text-slate-500 border-r border-slate-800">${idx + 1}</td>
                                    <td class="p-3 text-slate-200 font-medium border-r border-slate-800">${st}</td>
                                    ${topics.map(t => {
                                        const val = studentMap[st][t];
                                        return `<td class="p-3 text-center border-r border-slate-800 ${val !== undefined ? (val >= 75 ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold') : 'text-slate-600'}">${val !== undefined ? val : '-'}</td>`;
                                    }).join('')}
                                    <td class="p-3 text-center font-bold text-indigo-400 bg-indigo-950/20">${avg}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        };

        window.exportMatrixCSV = function() {
            const sel = document.getElementById('select-kelas-matrix');
            if (!sel || !sel.value) return;
            const kls = sel.value;
            const classGrades = cachedGrades.filter(g => g.kelas === kls);
            if (classGrades.length === 0) return;

            const studentMap = {};
            classGrades.forEach(g => {
                (g.dataSiswa || []).forEach(s => {
                    if (!studentMap[s.nama]) studentMap[s.nama] = {};
                    studentMap[s.nama][g.topik] = s.nilai;
                });
            });

            const students = Object.keys(studentMap).sort();
            const topics = classGrades.map(g => g.topik);

            let csv = `No,Nama Siswa,${topics.map(t => `"${t}"`).join(',')},Rata-Rata\n`;
            students.forEach((st, idx) => {
                let total = 0, count = 0;
                const row = [idx + 1, `"${st}"`];
                topics.forEach(t => {
                    const val = studentMap[st][t];
                    if (val !== undefined) {
                        total += val;
                        count++;
                        row.push(val);
                    } else {
                        row.push('');
                    }
                });
                row.push(count > 0 ? (total / count).toFixed(1) : '');
                csv += row.join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Matriks_Nilai_${kls}_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            window.showToast('CSV berhasil diekspor!');
        };

        window.exportMatrixPDF = function() {
            const sel = document.getElementById('select-kelas-matrix');
            if (!sel || !sel.value) return;
            const el = document.getElementById('matrix-table-container');
            if (!el) return;

            window.showToast('Membangun dokumen PDF matriks...', 'success');
            const opt = {
                margin: [0.4, 0.4, 0.4, 0.4],
                filename: `Matriks_Nilai_${sel.value}_${new Date().toISOString().split('T')[0]}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, backgroundColor: '#0f172a', scrollY: 0 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };
            html2pdf().set(opt).from(el).save().then(() => {
                window.showToast('PDF Matriks berhasil diunduh!');
            });
        };

        window.toggleJurnalForm = function() {
            const container = document.getElementById('jurnal-form-container');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                window.scrollTo({ top: container.offsetTop - 50, behavior: 'smooth' });
            } else {
                container.classList.add('hidden');
                document.getElementById('jurnal-form').reset();
                document.getElementById('edit-jurnal-id').value = '';
            }
        };

        document.getElementById('app').addEventListener('submit', async (e) => {
            if(e.target.id === 'jurnal-form') {
                e.preventDefault();
                const id = document.getElementById('edit-jurnal-id').value;
                const data = {
                    tanggal: document.getElementById('j-tanggal').value,
                    waktu: document.getElementById('j-waktu').value,
                    kelas: document.getElementById('j-kelas').value,
                    mapel: document.getElementById('j-mapel').value,
                    materi: document.getElementById('j-materi').value,
                    tujuan: document.getElementById('j-tujuan').value,
                    metode: document.getElementById('j-metode').value,
                    media: document.getElementById('j-media').value,
                    kehadiran: document.getElementById('j-kehadiran').value,
                    capaian: document.getElementById('j-capaian').value,
                    kendala: document.getElementById('j-kendala').value,
                    tindakLanjut: document.getElementById('j-tindak').value,
                    userId: currentUser.uid
                };

                if (is_preview) {
                    if (id) {
                        const idx = window.mockData.journals.findIndex(j => j.id === id);
                        if (idx !== -1) window.mockData.journals[idx] = { id, ...data };
                    } else {
                        window.mockData.journals.push({ id: 'j_' + Date.now(), ...data });
                    }
                    window.toggleJurnalForm();
                    loadGuruJournals();
                    window.showToast('Jurnal berhasil disimpan!');
                } else {
                    try {
                        if (db) {
                            if (id) {
                                await setDoc(doc(db, 'users', currentUser.uid, 'journals', id), data);
                            } else {
                                await addDoc(collection(db, 'users', currentUser.uid, 'journals'), data);
                            }
                        }
                        window.toggleJurnalForm();
                        window.showToast('Jurnal berhasil disimpan ke Cloud!');
                    } catch (err) {
                        window.showToast(err.message, 'error');
                    }
                }
            }

            if(e.target.id === 'grades-form') {
                e.preventDefault();
                const id = document.getElementById('edit-grade-id').value;
                const kelas = document.getElementById('g-kelas').value;
                const topik = document.getElementById('g-topik').value;
                const rawData = document.getElementById('g-raw-data').value;
                
                const dataSiswa = [];
                rawData.split('\n').forEach(line => {
                    const parts = line.trim().split(/\s+/);
                    if (parts.length >= 2) {
                        const nilai = parseFloat(parts.pop());
                        const nama = parts.join(' ');
                        if (nama && !isNaN(nilai)) dataSiswa.push({ nama, nilai });
                    }
                });

                if (dataSiswa.length === 0) return window.showToast('Format data tidak valid!', 'error');

                const gradeObj = { kelas, topik, tanggal: new Date().toISOString().split('T')[0], dataSiswa, userId: currentUser.uid };

                if (is_preview) {
                    if (id) {
                        const idx = window.mockData.grades.findIndex(g => g.id === id);
                        if (idx !== -1) window.mockData.grades[idx] = { id, ...gradeObj };
                    } else {
                        window.mockData.grades.push({ id: 'g_' + Date.now(), ...gradeObj });
                    }
                    window.toggleGradesForm();
                    loadGuruGrades();
                    window.showToast('Rekap nilai tersimpan!');
                } else {
                    try {
                        if (db) {
                            if (id) {
                                await setDoc(doc(db, 'users', currentUser.uid, 'grades', id), gradeObj);
                                window.showToast('Rekap nilai berhasil diperbarui!');
                            } else {
                                await addDoc(collection(db, 'users', currentUser.uid, 'grades'), gradeObj);
                                window.showToast('Rekap nilai berhasil disimpan ke Cloud!');
                            }
                        }
                        window.toggleGradesForm();
                    } catch (err) {
                        window.showToast(err.message, 'error');
                    }
                }
            }
        });

        window.editJurnal = function(id) {
            const j = cachedJournals.find(item => item.id === id);

            document.getElementById('edit-jurnal-id').value = j.id;
            ['tanggal','waktu','kelas','mapel','materi','tujuan','metode','media','kehadiran','capaian','kendala'].forEach(f => {
                const el = document.getElementById(`j-${f}`);

            document.getElementById('j-tindak').value = j.tindakLanjut || '';
            window.scrollTo({ top: container.offsetTop - 50, behavior: 'smooth' });
        };

            if (is_preview) {
                window.mockData.journals = window.mockData.journals.filter(j => j.id !== id);
                loadGuruJournals();
                window.showToast('Jurnal dihapus', 'success');

                try {

                    window.showToast(err.message, 'error');

            }
        };

        window.exportJurnalWord = function() {
            let dataToExport = [...cachedJournals];
            if (jurnalFilterKelas) {
                dataToExport = dataToExport.filter(j => j.kelas === jurnalFilterKelas);
            }
            if (jurnalFilterTanggalMulai) {
                dataToExport = dataToExport.filter(j => j.tanggal >= jurnalFilterTanggalMulai);
            }
            if (jurnalFilterTanggalSelesai) {
                dataToExport = dataToExport.filter(j => j.tanggal <= jurnalFilterTanggalSelesai);
            }

            if (dataToExport.length === 0) return window.showToast('Tidak ada jurnal untuk diekspor', 'error');

            window.showToast('Membangun dokumen Word (.doc) Rekap Jurnal...', 'success');

            const groupedByDate = {};
            dataToExport.forEach(j => {
                const tgl = j.tanggal || 'Tanpa Tanggal';
                if (!groupedByDate[tgl]) {
                    groupedByDate[tgl] = [];
                }
                groupedByDate[tgl].push(j);
            });

            const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(a) - new Date(b));

            const getIndoDay = (dStr) => {
                if (!dStr || dStr === 'Tanpa Tanggal') return '';
                try {
                    const p = dStr.split('-');
                    if (p.length === 3) {
                        const d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
                        return ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][d.getDay()] || '';
                    }
                } catch(e) {}
                return '';
            };

            const formatIndoDate = (dStr) => {
                if (!dStr || dStr === 'Tanpa Tanggal') return dStr;
                try {
                    const p = dStr.split('-');
                    if (p.length === 3) {
                        const d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
                        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                    }
                } catch(e) {}
                return dStr;
            };

            let periodeStr = '';
            if (jurnalFilterTanggalMulai && jurnalFilterTanggalSelesai) {
                periodeStr = `${formatIndoDate(jurnalFilterTanggalMulai)} sampai ${formatIndoDate(jurnalFilterTanggalSelesai)}`;
            } else if (jurnalFilterTanggalMulai) {
                periodeStr = `mulai ${formatIndoDate(jurnalFilterTanggalMulai)}`;
            } else if (sortedDates.length > 0) {
                const earliestDate = sortedDates[0];
                const latestDate = sortedDates[sortedDates.length - 1];
                periodeStr = `${formatIndoDate(earliestDate)} sampai ${formatIndoDate(latestDate)}`;
            } else {
                periodeStr = new Date().toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            }

            const docCity = schoolSettings.city || 'Banjarmasin';
            const kamadName = schoolSettings.headmasterName ? schoolSettings.headmasterName : '( .................................................... )';
            const kamadNip = schoolSettings.headmasterNip ? (schoolSettings.headmasterNip.startsWith('NIP') ? schoolSettings.headmasterNip : 'NIP. ' + schoolSettings.headmasterNip) : 'NIP. -';
            const todayIndo = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            const teacherName = currentUser.name || currentUser.email || 'Guru Mapel';
            const kopLines = (schoolSettings.kopInstansi || 'KEMENTERIAN AGAMA REPUBLIK INDONESIA\nKANTOR KEMENTERIAN AGAMA KOTA BANJARMASIN').split('\n');

            const govW = parseInt(schoolSettings.logoGovWidth) || 65;
            const madW = parseInt(schoolSettings.logoMadrasahWidth) || 65;
            const guruSig = window.getGuruSignature();
            const kamadSig = window.getKamadSignature();

            const tableRowsHTML = sortedDates.map((tgl, dIdx) => {
                const sessions = groupedByDate[tgl];
                sessions.sort((a, b) => (a.waktu || '').localeCompare(b.waktu || ''));
                const dayName = getIndoDay(tgl);
                const dateLabel = formatIndoDate(tgl);
                const fullDateHeader = `${dayName ? dayName + ', ' : ''}${dateLabel}`;

                return `
                    <tr style="background-color: ${dIdx % 2 === 0 ? '#ffffff' : '#fcfcfc'}; vertical-align: top;">

                                <div style="padding: 5px 3px; font-weight: 600; ${sIdx < sessions.length - 1 ? 'border-bottom: 1px solid #cbd5e1;' : ''}">
                                    ${(s.kelas || '-').replace(/kelas\\s*/i, '')} / ${s.mapel || '-'}
                                </div>
                            `).join('')}

                        <td style="border: 1px solid #334155; padding: 0;">

                                <div style="padding: 5px 5px; font-weight: 500; ${sIdx < sessions.length - 1 ? 'border-bottom: 1px solid #cbd5e1;' : ''}">
                                    ${s.materi || '-'}
                                </div>
                            `).join('')}

                        <td style="border: 1px solid #334155; padding: 0;">
                            ${sessions.map((s, sIdx) => `

                                    ${s.metode || '-'}<br>
                                    <span style="color: #475569;">${s.media || '-'}</span>
                                </div>
                            `).join('')}
                        </td>
                        <td style="border: 1px solid #334155; padding: 0;">

                                </div>

                                    ${s.kehadiran || '-'}
                                </div>

                                    ${s.kendala || '-'}
                                </div>
                            `).join('')}
                        </td>
                        <td style="border: 1px solid #334155; padding: 0;">

                                    ${s.tindakLanjut || '-'}
                                </div>

            }).join('');

            const wordDocumentHTML = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>

                                    <div style="font-size: 14pt; font-weight: 800; text-transform: uppercase; margin: 2pt 0;">${schoolSettings.name || 'MADRASAH IBTIDAIYAH AL-IRSYAD AL-ISLAMIYYAH'}</div>

            const blob = new Blob(['\ufeff', wordDocumentHTML], {

        window.exportJurnalPDF = function() {
            // Menyaring data sesuai filter kelas & rentang tanggal yang sedang aktif
            let dataToExport = [...cachedJournals];
            if (jurnalFilterKelas) {
                dataToExport = dataToExport.filter(j => j.kelas === jurnalFilterKelas);
            }
            if (jurnalFilterTanggalMulai) {
                dataToExport = dataToExport.filter(j => j.tanggal >= jurnalFilterTanggalMulai);
            }
            if (jurnalFilterTanggalSelesai) {
                dataToExport = dataToExport.filter(j => j.tanggal <= jurnalFilterTanggalSelesai);
            }

            if (dataToExport.length === 0) return window.showToast('Tidak ada jurnal untuk diekspor', 'error');
            
            window.showToast('Membangun dokumen PDF Rekap Jurnal Mengajar...', 'success');

            const printElement = document.createElement('div');

            // Kelompokkan entri jurnal berdasarkan tanggal
            const groupedByDate = {};
            dataToExport.forEach(j => {
                const tgl = j.tanggal || 'Tanpa Tanggal';
                if (!groupedByDate[tgl]) {
                    groupedByDate[tgl] = [];
                }
                groupedByDate[tgl].push(j);
            });

            // Urutkan tanggal secara kronologis (dari tanggal terlama ke tanggal terbaru)
            const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(a) - new Date(b));

            const getIndoDay = (dStr) => {
                if (!dStr || dStr === 'Tanpa Tanggal') return '';
                try {
                    const p = dStr.split('-');
                    if (p.length === 3) {
                        const d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
                        return ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][d.getDay()] || '';
                    }
                } catch(e) {}
                return '';
            };

            const formatIndoDate = (dStr) => {
                if (!dStr || dStr === 'Tanpa Tanggal') return dStr;
                try {
                    const p = dStr.split('-');
                    if (p.length === 3) {
                        const d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
                        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                    }
                } catch(e) {}
                return dStr;
            };

            // Menentukan keterangan teks periode cetak (kronologis dari tanggal awal ke tanggal akhir)
            let periodeStr = '';
            if (jurnalFilterTanggalMulai && jurnalFilterTanggalSelesai) {
                periodeStr = `${formatIndoDate(jurnalFilterTanggalMulai)} sampai ${formatIndoDate(jurnalFilterTanggalSelesai)}`;
            } else if (jurnalFilterTanggalMulai) {
                periodeStr = `mulai ${formatIndoDate(jurnalFilterTanggalMulai)}`;
            } else if (sortedDates.length > 0) {
                const earliestDate = sortedDates[0];
                const latestDate = sortedDates[sortedDates.length - 1];
                periodeStr = `${formatIndoDate(earliestDate)} sampai ${formatIndoDate(latestDate)}`;
            } else {
                periodeStr = new Date().toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            }

            const docCity = schoolSettings.city || 'Banjarmasin';
            const kamadName = schoolSettings.headmasterName ? schoolSettings.headmasterName : '( .................................................... )';
            const kamadNip = schoolSettings.headmasterNip ? (schoolSettings.headmasterNip.startsWith('NIP') ? schoolSettings.headmasterNip : 'NIP. ' + schoolSettings.headmasterNip) : 'NIP. -';
            const todayIndo = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            const teacherName = currentUser.name || currentUser.email || 'Guru Mapel';
            const guruSig = window.getGuruSignature();
            const kamadSig = window.getKamadSignature();

            let htmlContent = `

                                <div style="font-size: 15px; font-weight: 800; text-transform: uppercase; color: #000000; margin: 2px 0; letter-spacing: 0.5px;">${schoolSettings.name || 'MADRASAH IBTIDAIYAH AL-IRSYAD AL-ISLAMIYYAH'}</div>
                                ${schoolSettings.kopAlamat ? `<div style="font-size: 9.5px; color: #222222; font-weight: normal;">${schoolSettings.kopAlamat}</div>` : ''}

                            </td>
                        </tr>
                    </table>

                    <!-- JUDUL DOKUMEN & IDENTITAS -->

                    <!-- TABEL UTAMA 10 KOLOM -->
                    <table style="width: 100%; border-collapse: collapse; font-size: 9.5px; color: #000000; margin-bottom: 20px;">

                            <tr style="background-color: #f1f5f9; text-align: center; font-weight: bold;">
                                <th style="border: 1px solid #334155; padding: 6px 4px; width: 11%;">Hari/Tanggal</th>
                                <th style="border: 1px solid #334155; padding: 6px 4px; width: 8%;">Waktu</th>

                                <th style="border: 1px solid #334155; padding: 6px 4px; width: 13%;">Metode & Media</th>
                                <th style="border: 1px solid #334155; padding: 6px 4px; width: 9%;">Capaian</th>
                                <th style="border: 1px solid #334155; padding: 6px 4px; width: 7%;">Kehadiran</th>
                                <th style="border: 1px solid #334155; padding: 6px 4px; width: 7%;">Kendala</th>
                                <th style="border: 1px solid #334155; padding: 6px 4px; width: 8%;">Tindak Lanjut</th>

                        <tbody>
                            ${sortedDates.map((tgl, dIdx) => {
                                const sessions = groupedByDate[tgl];

                                const dayName = getIndoDay(tgl);
                                const dateLabel = formatIndoDate(tgl);

                                return `
                                    <tr style="background-color: ${dIdx % 2 === 0 ? '#ffffff' : '#fafafa'}; vertical-align: top; page-break-inside: avoid; break-inside: avoid;">
                                        <!-- KOLOM 1: HARI / TANGGAL -->
                                        <td style="border: 1px solid #334155; padding: 6px 5px; font-weight: bold; text-align: center;">
                                            ${fullDateHeader}

                                        <!-- KOLOM 2: WAKTU -->
                                        <td style="border: 1px solid #334155; padding: 0; text-align: center;">
                                            ${sessions.map((s, sIdx) => `
                                                <div style="padding: 5px 3px; font-family: monospace; ${sIdx < sessions.length - 1 ? 'border-bottom: 1px solid #cbd5e1;' : ''}">
                                                    (${s.waktu || '-'})
                                                </div>

                                        </td>

                                        <!-- KOLOM 3: KELAS / MAPEL -->
                                        <td style="border: 1px solid #334155; padding: 0; text-align: center;">
                                            ${sessions.map((s, sIdx) => `
                                                <div style="padding: 5px 3px; font-weight: 600; ${sIdx < sessions.length - 1 ? 'border-bottom: 1px solid #cbd5e1;' : ''}">
                                                    ${(s.kelas || '-').replace(/kelas\s*/i, '')} / ${s.mapel || '-'}
                                                </div>
                                            `).join('')}
                                        </td>

                                        <!-- KOLOM 4: BAB / MATERI -->
                                        <td style="border: 1px solid #334155; padding: 0;">
                                            ${sessions.map((s, sIdx) => `
                                                <div style="padding: 5px 5px; font-weight: 500; ${sIdx < sessions.length - 1 ? 'border-bottom: 1px solid #cbd5e1;' : ''}">
                                                    ${s.materi || '-'}
                                                </div>
                                            `).join('')}
                                        </td>

                                        <!-- KOLOM 5: TP (TUJUAN PEMBELAJARAN) -->
                                        <td style="border: 1px solid #334155; padding: 0;">
                                            ${sessions.map((s, sIdx) => `
                                                <div style="padding: 5px 5px; line-height: 1.25; ${sIdx < sessions.length - 1 ? 'border-bottom: 1px solid #cbd5e1;' : ''}">
                                                    ${s.tujuan || '-'}
                                                </div>
                                            `).join('')}
                                        </td>

                                        <!-- KOLOM 6: METODE & MEDIA -->
                                        <td style="border: 1px solid #334155; padding: 0;">
                                            ${sessions.map((s, sIdx) => `
                                                <div style="padding: 5px 5px; line-height: 1.25; ${sIdx < sessions.length - 1 ? 'border-bottom: 1px solid #cbd5e1;' : ''}">
                                                    ${s.metode || '-'}<br>
                                                    <span style="color: #475569;">${s.media || '-'}</span>
                                                </div>
                                            `).join('')}
                                        </td>

                                        <!-- KOLOM 7: CAPAIAN -->
                                        <td style="border: 1px solid #334155; padding: 0;">
                                            ${sessions.map((s, sIdx) => `
                                                <div style="padding: 5px 5px; ${sIdx < sessions.length - 1 ? 'border-bottom: 1px solid #cbd5e1;' : ''}">
                                                    ${s.capaian || '-'}
                                                </div>
                                            `).join('')}
                                        </td>

                                        <!-- KOLOM 8: KEHADIRAN -->
                                        <td style="border: 1px solid #334155; padding: 0; text-align: center;">
                                            ${sessions.map((s, sIdx) => `
                                                <div style="padding: 5px 3px; ${sIdx < sessions.length - 1 ? 'border-bottom: 1px solid #cbd5e1;' : ''}">
                                                    ${s.kehadiran || '-'}
                                                </div>
                                            `).join('')}
                                        </td>

                                        <!-- KOLOM 9: KENDALA -->
                                        <td style="border: 1px solid #334155; padding: 0;">
                                            ${sessions.map((s, sIdx) => `
                                                <div style="padding: 5px 5px; color: ${s.kendala && s.kendala.toLowerCase() !== 'tidak ada' ? '#b91c1c' : '#000000'}; ${sIdx < sessions.length - 1 ? 'border-bottom: 1px solid #cbd5e1;' : ''}">
                                                    ${s.kendala || '-'}
                                                </div>
                                            `).join('')}

                                        <!-- KOLOM 10: TINDAK LANJUT -->

                                                    ${s.tindakLanjut || '-'}

                                            `).join('')}

                                `;
                            }).join('')}
                        </tbody>
                    </table>

                    <!-- BLOK TANDA TANGAN DENGAN GAMBAR TTD / BARCODE (PNG) -->
                    <table style="width: 100%; border: none; margin-top: 30px; font-size: 11px; page-break-inside: avoid; break-inside: avoid;">

                                </div>
                                <p style="margin: 0; font-weight: bold; text-decoration: underline;">${kamadName}</p>

                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollY: 0 },

            html2pdf().set(opt).from(printElement).save().then(() => {

        function loadGuruJournals() {
            if (is_preview) {
                cachedJournals = window.mockData.journals.filter(j => j.userId === currentUser.uid);
                renderJournalsUI(cachedJournals);
            } else {
                if (!db) return;
                onSnapshot(collection(db, 'users', currentUser.uid, 'journals'), (snapshot) => {
                    cachedJournals = [];
                    snapshot.forEach(doc => cachedJournals.push({ id: doc.id, ...doc.data() }));
                    renderJournalsUI(cachedJournals);
                }, (err) => { console.error(err); });
            }
        }

        window.setJurnalFilterKelas = function(val) {
            jurnalFilterKelas = val;
            renderJournalsUI(cachedJournals);
        };

        window.setJurnalFilterTanggalMulai = function(val) {
            jurnalFilterTanggalMulai = val;
            renderJournalsUI(cachedJournals);
        };

        window.setJurnalFilterTanggalSelesai = function(val) {
            jurnalFilterTanggalSelesai = val;
            renderJournalsUI(cachedJournals);
        };

        window.resetJurnalFilter = function() {
            jurnalFilterKelas = '';
            jurnalFilterTanggalMulai = '';
            jurnalFilterTanggalSelesai = '';
            const kEl = document.getElementById('filter-jurnal-kelas');
            const tmEl = document.getElementById('filter-jurnal-tanggal-mulai');
            const tsEl = document.getElementById('filter-jurnal-tanggal-selesai');
            if(kEl) kEl.value = '';
            if(tmEl) tmEl.value = '';
            if(tsEl) tsEl.value = '';
            renderJournalsUI(cachedJournals);
        };

        function renderJournalsUI(journals) {
            const container = document.getElementById('guru-jurnal-grid');
            if(!container) return;

            // Memperbarui opsi filter kelas secara otomatis
            const selectKelas = document.getElementById('filter-jurnal-kelas');
            if (selectKelas) {
                const uniqueKelas = [...new Set(journals.map(j => j.kelas).filter(Boolean))].sort();
                const curVal = selectKelas.value;
                selectKelas.innerHTML = `<option value="">Semua Kelas</option>` + 
                    uniqueKelas.map(k => `<option value="${k}" ${k === curVal ? 'selected' : ''}>${k}</option>`).join('');
            }

            // Menyaring dan mengurutkan secara kronologis (terbaru ke terlama)
            let filtered = [...journals];
            if (jurnalFilterKelas) {
                filtered = filtered.filter(j => j.kelas === jurnalFilterKelas);
            }
            if (jurnalFilterTanggalMulai) {
                filtered = filtered.filter(j => j.tanggal >= jurnalFilterTanggalMulai);
            }
            if (jurnalFilterTanggalSelesai) {
                filtered = filtered.filter(j => j.tanggal <= jurnalFilterTanggalSelesai);
            }

            filtered.sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal));

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 italic py-4 text-center">Tidak ada jurnal yang sesuai dengan kriteria filter.</p>`;
                return;
            }

            container.innerHTML = filtered.map(j => `
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2 relative">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center space-x-2">
                            ${j.kelas ? `<span class="text-[10px] font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-0.5 rounded border border-indigo-500/25 uppercase">${j.kelas}</span>` : ''}
                            <span class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/25 uppercase">${j.mapel}</span>
                            <h4 class="text-sm font-bold text-white mt-1">${j.materi}</h4>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs text-slate-400">${j.tanggal} (${j.waktu})</span>
                            <button onclick="window.editJurnal('${j.id}')" class="text-indigo-400 hover:text-indigo-300 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="window.deleteJurnal('${j.id}')" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                    <p class="text-xs text-slate-300"><strong>Tujuan:</strong> ${j.tujuan}</p>
                    <p class="text-xs text-slate-300"><strong>Metode:</strong> ${j.metode} | Media: ${j.media}</p>
                    <p class="text-xs text-slate-300"><strong>Kehadiran:</strong> ${j.kehadiran}</p>
                    <p class="text-xs text-slate-300"><strong>Capaian:</strong> ${j.capaian}</p>
                    <p class="text-xs text-rose-300"><strong>Kendala:</strong> ${j.kendala}</p>
                    <p class="text-xs text-indigo-300"><strong>Tindak Lanjut:</strong> ${j.tindakLanjut}</p>
                    
                    ${j.adminNotes ? `
